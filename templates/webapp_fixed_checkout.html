<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ET-FOOD - Order Now</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .language-selector {
            background: #16213e;
            border: none;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .search-bar {
            position: relative;
            margin-bottom: 30px;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            background: #16213e;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        
        .search-input::placeholder {
            color: #6b7280;
        }
        
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }
        
        .categories {
            margin-bottom: 30px;
        }
        
        .categories h2 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .category-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            background: linear-gradient(135deg, #16213e, #0f172a);
            border: 1px solid #374151;
        }
        
        .category-card:hover {
            transform: scale(1.05);
        }
        
        .category-icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }
        
        .products {
            margin-bottom: 100px;
        }
        
        .products h2 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .product-card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-2px);
        }
        
        .product-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        
        .product-info {
            padding: 15px;
        }
        
        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .product-price {
            color: #fbbf24;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .product-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .btn-add, .btn-remove {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .btn-add:hover, .btn-remove:hover {
            background: #2563eb;
        }
        
        .btn-remove {
            background: #ef4444;
        }
        
        .btn-remove:hover {
            background: #dc2626;
        }
        
        .quantity-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #3b82f6;
            color: #ffffff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
        
        /* Checkout Modal Styles */
        .checkout-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .checkout-modal-content {
            background: #16213e;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .checkout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #374151;
        }
        
        .checkout-header h3 {
            margin: 0;
            color: #ffffff;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .checkout-body {
            padding: 20px;
        }
        
        .order-summary {
            margin-bottom: 20px;
        }
        
        .order-summary h4 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .order-items {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: #d1d5db;
        }
        
        .order-item:last-child {
            margin-bottom: 0;
        }
        
        .order-total {
            text-align: right;
            color: #ffffff;
            font-size: 18px;
        }
        
        .customer-info {
            margin-bottom: 20px;
        }
        
        .customer-info h4 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .customer-info input,
        .customer-info textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #374151;
            border-radius: 8px;
            background: #1a1a2e;
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .customer-info input::placeholder,
        .customer-info textarea::placeholder {
            color: #6b7280;
        }
        
        .payment-options {
            margin-bottom: 20px;
        }
        
        .payment-options h4 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .payment-method {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #374151;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        
        .payment-method:hover {
            border-color: #3b82f6;
        }
        
        .payment-method.checked {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }
        
        .payment-method input[type="radio"] {
            margin-right: 10px;
        }
        
        .payment-icon {
            font-size: 20px;
            margin-right: 10px;
        }
        
        .payment-method span:last-child {
            color: #ffffff;
            font-weight: 500;
        }
        
        .place-order-btn {
            width: 100%;
            padding: 15px;
            background: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .place-order-btn:hover {
            background: #2563eb;
        }
        
        .place-order-btn:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }
        
        .cart-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .cart-info:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        /* Compact Order History Styles */
        .order-history-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .order-history-content {
            background: #0f172a;
            border-radius: 16px;
            padding: 0;
            width: 95%;
            max-width: 500px;
            max-height: 90vh;
            overflow: hidden;
            border: 1px solid #374151;
        }

        .order-history-header {
            background: linear-gradient(135deg, #16213e, #0f172a);
            padding: 15px 20px;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-history-header h3 {
            color: #ffffff;
            margin: 0;
            font-size: 16px;
        }

        .order-history-close {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-history-body {
            padding: 15px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .order-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            margin-bottom: 6px;
            padding: 6px 8px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .order-info {
            flex: 1;
        }

        .order-number {
            color: #3b82f6;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 1px;
        }

        .order-date {
            color: #9ca3af;
            font-size: 9px;
        }

        .order-status {
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fbbf24;
            color: #92400e;
        }

        .status-confirmed {
            background: #3b82f6;
            color: #ffffff;
        }

        .status-preparing {
            background: #f59e0b;
            color: #ffffff;
        }

        .status-out_for_delivery {
            background: #8b5cf6;
            color: #ffffff;
        }

        .status-delivered {
            background: #10b981;
            color: #ffffff;
        }

        .status-cancelled {
            background: #ef4444;
            color: #ffffff;
        }

        .order-total {
            color: #3b82f6;
            font-size: 11px;
            font-weight: 600;
            margin-top: 1px;
        }

        .order-actions {
            display: flex;
            gap: 3px;
            margin-top: 4px;
        }

        .order-action-btn {
            padding: 2px 6px;
            border: none;
            border-radius: 3px;
            font-size: 9px;
            cursor: pointer;
            transition: background 0.3s;
            flex: 1;
            min-width: 0;
        }

        .btn-track {
            background: #3b82f6;
            color: #ffffff;
        }

        .btn-track:hover {
            background: #2563eb;
        }

        .btn-reorder {
            background: #16a34a;
            color: #ffffff;
        }

        .btn-reorder:hover {
            background: #15803d;
        }

        .btn-cancel {
            background: #ef4444;
            color: #ffffff;
        }

        .btn-cancel:hover {
            background: #dc2626;
        }

        .no-orders {
            text-align: center;
            color: #9ca3af;
            padding: 30px 20px;
        }

        .no-orders-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .checkout-modal {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with Profile and Language -->
        <div class="header">
            <div class="profile-info" onclick="showUserProfile()">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <div>
                    <div style="font-size: 14px; color: #6b7280;" id="profileName">Profile</div>
                    <div style="font-size: 12px; color: #9ca3af;" id="profilePhone"></div>
                </div>
            </div>
            <select class="language-selector" id="languageSelector" onchange="changeLanguage()">
                <option value="en">🇬🇧 English</option>
                <option value="am">🇪🇹 አማርኛ</option>
                <option value="or">🇪🇹 Afaan Oromoo</option>
                <option value="ti">🇪🇹 ትግርኛ</option>
            </select>
        </div>

        <!-- Order History Modal -->
        <div id="orderHistoryModal" class="order-history-modal">
            <div class="order-history-content">
                <div class="order-history-header">
                    <h3>📋 Order History</h3>
                    <button onclick="closeOrderHistory()" class="order-history-close">✕</button>
                </div>
                <div class="order-history-body" id="orderHistoryBody">
                    <!-- Order history will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" class="search-input" placeholder="Search" id="searchInput">
            <span class="search-icon">🔍</span>
        </div>

        <!-- Categories -->
        <div class="categories">
            <h2 id="categoriesTitle">Categories</h2>
            <div class="category-grid" id="categoriesContainer">
                <!-- Categories will be loaded dynamically from the database -->
            </div>
        </div>

        <!-- Products -->
        <div class="products">
            <h2 id="productsTitle">Products</h2>
            <div class="product-grid" id="productGrid">
                <!-- Products will be loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Cart Info -->
    <div class="cart-info" id="cartInfo" style="display: none;" onclick="showOrderForm()">
        <span id="cartText">Cart</span> • <span id="cartTotal">0 ETB</span>
    </div>

    <script>
        let selectedItems = {};
        let menuItems = [];
        let currentCategory = 'all';
        let currentLanguage = 'en';
        let currentUser = {};

        // Initialize Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            
            // Set theme
            document.body.style.backgroundColor = tg.themeParams.bg_color || '#1a1a2e';
            document.body.style.color = tg.themeParams.text_color || '#ffffff';
            
            // Configure main button
            tg.MainButton.text = "Place Order";
            tg.MainButton.color = "#3b82f6";
            
            // Handle main button click
            tg.MainButton.onClick(() => {
                if (Object.keys(selectedItems).length > 0) {
                    showOrderForm();
                }
            });
            updateMainButton();
        }

        // Load user profile
        function loadUserProfile() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                currentUser = {
                    id: user.id,
                    first_name: user.first_name || '',
                    last_name: user.last_name || '',
                    username: user.username || '',
                    phone_number: user.phone_number || '',
                    language_code: user.language_code || 'en'
                };
                updateProfileDisplay();
            } else {
                currentUser = {
                    id: 'demo_user',
                    first_name: 'Demo',
                    last_name: 'User',
                    username: 'demo_user',
                    phone_number: '',
                    language_code: 'en'
                };
                updateProfileDisplay();
            }
        }

        function updateProfileDisplay() {
            const fullName = `${currentUser.first_name || ''} ${currentUser.last_name || ''}`.trim();
            const displayName = fullName || currentUser.username || 'Guest User';
            
            const profileNameElement = document.getElementById('profileName');
            const profilePhoneElement = document.getElementById('profilePhone');
            
            if (profileNameElement) {
                profileNameElement.textContent = displayName;
            }
            if (profilePhoneElement) {
                profilePhoneElement.textContent = currentUser.phone_number || '';
            }
            
            // Generate avatar from first letter of name
            const avatarElement = document.getElementById('profileAvatar');
            if (currentUser.first_name && currentUser.first_name.length > 0) {
                const avatarLetter = currentUser.first_name.charAt(0).toUpperCase();
                if (avatarElement) avatarElement.textContent = avatarLetter;
            } else {
                if (avatarElement) avatarElement.textContent = '👤';
            }
        }

        function showUserProfile() {
            // Show order history directly
            viewOrderHistory();
        }

        // Load menu items
        async function loadMenuItems() {
            try {
                const response = await fetch('/api/menu');
                menuItems = await response.json();
                displayProducts();
            } catch (error) {
                console.error('Error loading menu:', error);
            }
        }

        // Display products
        function displayProducts() {
            const grid = document.getElementById('productGrid');
            if (!grid) return;
            
            let filteredItems = menuItems;
            
            grid.innerHTML = '';
            
            filteredItems.forEach(item => {
                const priceETB = Math.round(item.price);
                const quantity = selectedItems[item.id] || 0;
                
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                
                const fallbackImage = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMTIwIiB2aWV3Qm94PSIwIDAgMjAwIDEyMCI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIxMjAiIGZpbGw9IiMxNjIxM2UiLz48dGV4dCB4PSIxMDAiIHk9IjYwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSIgZmlsbD0iI2ZmZmZmZiIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiPvCfjaU8L3RleHQ+PC9zdmc+';
                
                productCard.innerHTML = `
                    <img src="${item.image_url}" alt="${item.name}" class="product-image" onerror="this.src='${fallbackImage}'">
                    <div class="product-info">
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">${priceETB.toLocaleString()} ETB</div>
                        <div class="product-buttons">
                            ${quantity > 0 ? `<button class="btn-remove" onclick="updateQuantity(${item.id}, -1)">-</button>` : ''}
                            <button class="btn-add" onclick="updateQuantity(${item.id}, 1)">
                                ${quantity > 0 ? quantity : 'ADD'}
                            </button>
                        </div>
                    </div>
                    ${quantity > 0 ? `<div class="quantity-badge">${quantity}</div>` : ''}
                `;
                
                grid.appendChild(productCard);
            });
        }

        // Update quantity
        function updateQuantity(itemId, change) {
            const item = menuItems.find(i => i.id === itemId);
            if (!item) return;
            
            const currentQuantity = selectedItems[itemId] || 0;
            const newQuantity = Math.max(0, currentQuantity + change);
            
            if (newQuantity === 0) {
                delete selectedItems[itemId];
            } else {
                selectedItems[itemId] = newQuantity;
            }
            
            displayProducts();
            updateCartInfo();
            updateMainButton();
        }

        // Update cart info
        function updateCartInfo() {
            const cartInfo = document.getElementById('cartInfo');
            const cartText = document.getElementById('cartText');
            const cartTotal = document.getElementById('cartTotal');
            
            const totalItems = Object.values(selectedItems).reduce((sum, qty) => sum + qty, 0);
            const totalPrice = Object.entries(selectedItems).reduce((sum, [itemId, qty]) => {
                const item = menuItems.find(i => i.id == itemId);
                return sum + (item ? item.price * qty : 0);
            }, 0);
            
            if (totalItems > 0) {
                cartInfo.style.display = 'block';
                cartText.textContent = `Cart (${totalItems})`;
                cartTotal.textContent = `${Math.round(totalPrice)} ETB`;
            } else {
                cartInfo.style.display = 'none';
            }
        }

        // Update main button
        function updateMainButton() {
            if (window.Telegram && window.Telegram.WebApp) {
                const totalItems = Object.values(selectedItems).reduce((sum, qty) => sum + qty, 0);
                
                if (totalItems > 0) {
                    window.Telegram.WebApp.MainButton.show();
                } else {
                    window.Telegram.WebApp.MainButton.hide();
                }
            }
        }

        // Show order form
        function showOrderForm() {
            if (Object.keys(selectedItems).length === 0) {
                alert('Please select items first');
                return;
            }
            
            const orderData = {
                items: Object.entries(selectedItems).map(([itemId, quantity]) => {
                    const item = menuItems.find(i => i.id == itemId);
                    return {
                        id: itemId,
                        name: item.name,
                        price: item.price,
                        quantity: quantity,
                        total: item.price * quantity
                    };
                }),
                total_amount: Object.entries(selectedItems).reduce((sum, [itemId, qty]) => {
                    const item = menuItems.find(i => i.id == itemId);
                    return sum + (item ? item.price * qty : 0);
                }, 0)
            };
            
            showCheckoutModal(orderData);
        }

        // Show checkout modal - FIXED VERSION
        function showCheckoutModal(orderData) {
            // Remove any existing modal first
            const existingModal = document.querySelector('.checkout-modal');
            if (existingModal) {
                existingModal.remove();
            }
            
            const modal = document.createElement('div');
            modal.className = 'checkout-modal';
            modal.innerHTML = `
                <div class="checkout-modal-content">
                    <div class="checkout-header">
                        <h3>🛒 Checkout</h3>
                        <button onclick="closeCheckoutModal()" class="close-btn">✕</button>
                    </div>
                    <div class="checkout-body">
                        <div class="order-summary">
                            <h4>Order Summary</h4>
                            <div class="order-items">
                                ${orderData.items.map(item => `
                                    <div class="order-item">
                                        <span>${item.name} x${item.quantity}</span>
                                        <span>${Math.round(item.total)} ETB</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="order-total">
                                <strong>Total: ${Math.round(orderData.total_amount)} ETB</strong>
                            </div>
                        </div>
                        
                        <div class="customer-info">
                            <h4>Customer Information</h4>
                            <input type="text" id="customerName" placeholder="Full Name" required>
                            <input type="tel" id="customerPhone" placeholder="Phone Number" required>
                            <textarea id="customerAddress" placeholder="Delivery Address" rows="3" required></textarea>
                        </div>
                        
                        <div class="payment-options">
                            <h4>Payment Method</h4>
                            <div class="payment-method">
                                <input type="radio" id="telebirr" name="paymentMethod" value="telebirr" checked>
                                <span class="payment-icon">💳</span>
                                <span>TeleBirr</span>
                            </div>
                            <div class="payment-method">
                                <input type="radio" id="mpesa" name="paymentMethod" value="mpesa">
                                <span class="payment-icon">📱</span>
                                <span>M-Pesa</span>
                            </div>
                            <div class="payment-method">
                                <input type="radio" id="cash" name="paymentMethod" value="cash">
                                <span class="payment-icon">💵</span>
                                <span>Cash on Delivery</span>
                            </div>
                        </div>
                        
                        <button class="place-order-btn" onclick="submitOrder()">
                            Place Order - ${Math.round(orderData.total_amount)} ETB
                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Store order data for later use
            window.currentOrderData = orderData;
            
            // Add event listeners for payment method selection
            setTimeout(() => {
                const paymentMethods = document.querySelectorAll('input[name="paymentMethod"]');
                paymentMethods.forEach(method => {
                    method.addEventListener('change', function() {
                        document.querySelectorAll('.payment-method').forEach(label => {
                            label.classList.remove('checked');
                        });
                        this.closest('.payment-method').classList.add('checked');
                    });
                });
                
                // Set initial selection
                const checkedMethod = document.querySelector('input[name="paymentMethod"]:checked');
                if (checkedMethod) {
                    checkedMethod.closest('.payment-method').classList.add('checked');
                }
            }, 100);
        }

        // Close checkout modal
        function closeCheckoutModal() {
            const modal = document.querySelector('.checkout-modal');
            if (modal) {
                modal.remove();
            }
        }

        // Submit order - ENHANCED VERSION
        async function submitOrder() {
            const placeOrderBtn = document.querySelector('.place-order-btn');
            if (!placeOrderBtn) return;
            
            // Disable button and show loading
            placeOrderBtn.disabled = true;
            placeOrderBtn.textContent = 'Processing...';
            
            // Get form data
            const customerName = document.getElementById('customerName').value.trim();
            const customerPhone = document.getElementById('customerPhone').value.trim();
            const customerAddress = document.getElementById('customerAddress').value.trim();
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked')?.value;
            
            // Validate required fields
            if (!customerName || !customerPhone || !customerAddress || !paymentMethod) {
                alert('Please fill in all required fields');
                placeOrderBtn.disabled = false;
                placeOrderBtn.textContent = `Place Order - ${Math.round(window.currentOrderData.total_amount)} ETB`;
                return;
            }
            
            // Prepare order data
            const orderData = {
                items: window.currentOrderData.items,
                total_amount: window.currentOrderData.total_amount,
                customer_name: customerName,
                customer_phone: customerPhone,
                customer_address: customerAddress,
                payment_method: paymentMethod,
                telegram_user_id: currentUser.id || 'demo_user'
            };
            
            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(orderData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    
                    // Clear cart
                    selectedItems = {};
                    displayProducts();
                    updateCartInfo();
                    updateMainButton();
                    closeCheckoutModal();
                    
                    // Show success message
                    alert(`Order placed successfully! Order ID: ${result.order_id}`);
                } else {
                    throw new Error('Failed to submit order');
                }
            } catch (error) {
                console.error('Error submitting order:', error);
                alert('Failed to place order. Please try again.');
                
                // Reset button state
                placeOrderBtn.disabled = false;
                placeOrderBtn.textContent = `Place Order - ${Math.round(window.currentOrderData.total_amount)} ETB`;
            }
        }

        // Order History Functions - ENHANCED VERSION
        async function viewOrderHistory() {
            document.getElementById('orderHistoryModal').style.display = 'flex';
            await loadOrderHistory();
        }

        function closeOrderHistory() {
            document.getElementById('orderHistoryModal').style.display = 'none';
        }

        async function loadOrderHistory() {
            try {
                const orderHistoryBody = document.getElementById('orderHistoryBody');
                orderHistoryBody.innerHTML = '<div style="text-align: center; padding: 20px; color: #9ca3af;">Loading orders...</div>';
                
                let userId = 'demo_user';
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    userId = window.Telegram.WebApp.initDataUnsafe.user.id;
                }
                
                const response = await fetch(`/api/orders?user_id=${userId}`);
                const orders = await response.json();
                
                if (orders.length === 0) {
                    orderHistoryBody.innerHTML = `
                        <div class="no-orders">
                            <div class="no-orders-icon">📋</div>
                            <div>No orders yet</div>
                        </div>
                    `;
                    return;
                }
                
                // Display orders with compact design
                orderHistoryBody.innerHTML = orders.map(order => `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="order-info">
                                <div class="order-number">Order #${order.id}</div>
                                <div class="order-date">${new Date(order.created_at).toLocaleDateString()}</div>
                            </div>
                            <div>
                                <div class="order-status status-${order.status}">${order.status}</div>
                                <div class="order-total">${Math.round(order.total_amount)} ETB</div>
                            </div>
                        </div>
                        <div class="order-actions">
                            ${order.status === 'pending' ? `<button class="order-action-btn btn-cancel" onclick="cancelOrder(${order.id})">Cancel</button>` : ''}
                            ${order.status === 'confirmed' || order.status === 'preparing' ? `<button class="order-action-btn btn-cancel" onclick="cancelOrder(${order.id})">Cancel</button>` : ''}
                            <button class="order-action-btn btn-track" onclick="trackOrder(${order.id})">Track</button>
                            ${order.status === 'delivered' ? `<button class="order-action-btn btn-reorder" onclick="reorderItems(${order.id})">Reorder</button>` : ''}
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading order history:', error);
                document.getElementById('orderHistoryBody').innerHTML = `
                    <div style="text-align: center; padding: 20px; color: #ef4444;">
                        Error loading orders. Please try again.
                    </div>
                `;
            }
        }

        // Cancel Order Function - NEW FEATURE
        async function cancelOrder(orderId) {
            if (!confirm('Are you sure you want to cancel this order?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/orders/${orderId}/cancel`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (response.ok) {
                    alert('Order cancelled successfully');
                    await loadOrderHistory(); // Refresh the order history
                } else {
                    const errorData = await response.json();
                    alert(errorData.error || 'Failed to cancel order');
                }
            } catch (error) {
                console.error('Error cancelling order:', error);
                alert('Failed to cancel order. Please try again.');
            }
        }

        // Track Order Function
        function trackOrder(orderId) {
            alert(`Tracking order #${orderId}. This feature will be enhanced in the next update.`);
        }

        // Reorder Function
        function reorderItems(orderId) {
            alert(`Reordering items from order #${orderId}. This feature will be enhanced in the next update.`);
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            if (searchTerm) {
                const filteredItems = menuItems.filter(item => 
                    item.name.toLowerCase().includes(searchTerm) ||
                    item.description.toLowerCase().includes(searchTerm)
                );
                
                displayFilteredProducts(filteredItems);
            } else {
                displayProducts();
            }
        });

        function displayFilteredProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            items.forEach(item => {
                const priceETB = Math.round(item.price);
                const quantity = selectedItems[item.id] || 0;
                
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                
                const fallbackImage = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMTIwIiB2aWV3Qm94PSIwIDAgMjAwIDEyMCI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIxMjAiIGZpbGw9IiMxNjIxM2UiLz48dGV4dCB4PSIxMDAiIHk9IjYwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSIgZmlsbD0iI2ZmZmZmZiIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiPvCfjaU8L3RleHQ+PC9zdmc+';
                
                productCard.innerHTML = `
                    <img src="${item.image_url}" alt="${item.name}" class="product-image" onerror="this.src='${fallbackImage}'">
                    <div class="product-info">
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">${priceETB.toLocaleString()} ETB</div>
                        <div class="product-buttons">
                            ${quantity > 0 ? `<button class="btn-remove" onclick="updateQuantity(${item.id}, -1)">-</button>` : ''}
                            <button class="btn-add" onclick="updateQuantity(${item.id}, 1)">
                                ${quantity > 0 ? quantity : 'ADD'}
                            </button>
                        </div>
                    </div>
                    ${quantity > 0 ? `<div class="quantity-badge">${quantity}</div>` : ''}
                `;
                
                grid.appendChild(productCard);
            });
        }

        // Initialize the app
        window.addEventListener('load', function() {
            loadUserProfile();
            loadMenuItems();
        });
    </script>
</body>
</html>
