<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Registration - ET-FOOD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px 0;
        }
        .registration-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ffa726 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2rem;
        }
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        .form-container {
            padding: 30px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-section h4 {
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        .document-upload {
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        .document-upload.dragover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }
        .document-upload input[type="file"] {
            display: none;
        }
        .document-upload label {
            cursor: pointer;
            color: #666;
            font-size: 14px;
        }
        .document-upload label:hover {
            color: #667eea;
        }
        .document-uploaded {
            border-color: #28a745;
            background-color: #f8fff8;
        }
        .document-uploaded .fa-check {
            color: #28a745;
        }
        .required {
            color: #dc3545;
        }
        .vehicle-type-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
        .alert {
            border-radius: 8px;
            border: none;
        }
        .spinner-border {
            width: 1.5rem;
            height: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="registration-container">
        <div class="header">
            <h1><i class="fas fa-truck"></i> Driver Registration</h1>
            <p>Join the ET-FOOD delivery team and start earning today!</p>
        </div>
        
        <div class="form-container">
            <div id="alert-container"></div>
            
            <form id="registrationForm" enctype="multipart/form-data">
                <input type="hidden" name="chat_id" value="{{ chat_id }}">
                
                <!-- Personal Information -->
                <div class="form-section">
                    <h4><i class="fas fa-user"></i> Personal Information</h4>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name <span class="required">*</span></label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number <span class="required">*</span></label>
                                <input type="tel" class="form-control" id="phone" name="phone" placeholder="+251911234567" required>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="optional">
                    </div>
                </div>
                
                <!-- Vehicle Information -->
                <div class="form-section">
                    <h4><i class="fas fa-car"></i> Vehicle Information</h4>
                    <div class="mb-3">
                        <label for="vehicle_type" class="form-label">Vehicle Type <span class="required">*</span></label>
                        <select class="form-control" id="vehicle_type" name="vehicle_type" required>
                            <option value="">Select Vehicle Type</option>
                            <option value="bicycle">Bicycle</option>
                            <option value="motorcycle">Motorcycle</option>
                            <option value="car">Car</option>
                        </select>
                        <div class="vehicle-type-info" id="vehicleInfo" style="display: none;">
                            <i class="fas fa-info-circle"></i> <span id="vehicleInfoText"></span>
                        </div>
                    </div>
                </div>
                
                <!-- Document Upload -->
                <div class="form-section">
                    <h4><i class="fas fa-file-alt"></i> Required Documents</h4>
                    
                    <!-- Driver's License -->
                    <div class="document-section" id="licenseSection">
                        <h6>Driver's License <span class="required">*</span></h6>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="document-upload" id="licenseFrontUpload">
                                    <input type="file" id="license_front" name="license_front" accept="image/*" required>
                                    <label for="license_front">
                                        <i class="fas fa-upload"></i><br>
                                        <strong>Front Side</strong><br>
                                        Click to upload or drag & drop
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="document-upload" id="licenseBackUpload">
                                    <input type="file" id="license_back" name="license_back" accept="image/*" required>
                                    <label for="license_back">
                                        <i class="fas fa-upload"></i><br>
                                        <strong>Back Side</strong><br>
                                        Click to upload or drag & drop
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Government ID -->
                    <div class="document-section">
                        <h6>Government ID <span class="required">*</span></h6>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="document-upload" id="idFrontUpload">
                                    <input type="file" id="id_front" name="id_front" accept="image/*" required>
                                    <label for="id_front">
                                        <i class="fas fa-upload"></i><br>
                                        <strong>Front Side</strong><br>
                                        Click to upload or drag & drop
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="document-upload" id="idBackUpload">
                                    <input type="file" id="id_back" name="id_back" accept="image/*" required>
                                    <label for="id_back">
                                        <i class="fas fa-upload"></i><br>
                                        <strong>Back Side</strong><br>
                                        Click to upload or drag & drop
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Vehicle Registration -->
                    <div class="document-section" id="vehicleRegSection">
                        <h6>Vehicle Registration <span class="required">*</span></h6>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="document-upload" id="vehicleRegUpload">
                                    <input type="file" id="vehicle_registration" name="vehicle_registration" accept="image/*" required>
                                    <label for="vehicle_registration">
                                        <i class="fas fa-upload"></i><br>
                                        <strong>Registration Document</strong><br>
                                        Click to upload or drag & drop
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-paper-plane"></i> Submit Registration
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Vehicle type change handler
        document.getElementById('vehicle_type').addEventListener('change', function() {
            const vehicleInfo = document.getElementById('vehicleInfo');
            const vehicleInfoText = document.getElementById('vehicleInfoText');
            const licenseSection = document.getElementById('licenseSection');
            const vehicleRegSection = document.getElementById('vehicleRegSection');
            const licenseFront = document.getElementById('license_front');
            const licenseBack = document.getElementById('license_back');
            const vehicleReg = document.getElementById('vehicle_registration');
            
            if (this.value === 'bicycle') {
                vehicleInfo.style.display = 'block';
                vehicleInfoText.innerHTML = '<strong>Bicycle drivers:</strong> Only Government ID is required. Driver\'s license and vehicle registration are not needed.';
                licenseSection.style.display = 'none';
                vehicleRegSection.style.display = 'none';
                licenseFront.required = false;
                licenseBack.required = false;
                vehicleReg.required = false;
            } else {
                vehicleInfo.style.display = 'block';
                vehicleInfoText.innerHTML = '<strong>Car/Motorcycle drivers:</strong> All documents are required including driver\'s license and vehicle registration.';
                licenseSection.style.display = 'block';
                vehicleRegSection.style.display = 'block';
                licenseFront.required = true;
                licenseBack.required = true;
                vehicleReg.required = true;
            }
        });
        
        // File upload handlers
        document.querySelectorAll('input[type="file"]').forEach(input => {
            input.addEventListener('change', function() {
                const uploadDiv = this.parentElement;
                const label = uploadDiv.querySelector('label');
                
                if (this.files && this.files[0]) {
                    uploadDiv.classList.add('document-uploaded');
                    label.innerHTML = '<i class="fas fa-check"></i><br><strong>File Uploaded</strong><br>' + this.files[0].name;
                } else {
                    uploadDiv.classList.remove('document-uploaded');
                    label.innerHTML = '<i class="fas fa-upload"></i><br><strong>' + label.dataset.title + '</strong><br>Click to upload or drag & drop';
                }
            });
        });
        
        // Form submission
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const alertContainer = document.getElementById('alert-container');
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';
            
            // Create FormData
            const formData = new FormData(this);
            
            // Submit form
            fetch('/api/driver-registration', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle"></i> 
                            Registration submitted successfully! You'll receive a notification once approved.
                        </div>
                    `;
                    this.reset();
                } else {
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-circle"></i> 
                            ${data.error || 'Registration failed. Please try again.'}
                        </div>
                    `;
                }
            })
            .catch(error => {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle"></i> 
                        Network error. Please check your connection and try again.
                    </div>
                `;
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Registration';
            });
        });
        
        // Auto-scroll to alert
        function scrollToAlert() {
            const alertContainer = document.getElementById('alert-container');
            if (alertContainer.children.length > 0) {
                alertContainer.scrollIntoView({ behavior: 'smooth' });
            }
        }
        
        // Call scroll function after alerts are shown
        const observer = new MutationObserver(scrollToAlert);
        observer.observe(document.getElementById('alert-container'), { childList: true });
    </script>
</body>
</html>
