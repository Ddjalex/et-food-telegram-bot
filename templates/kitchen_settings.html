<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Settings - ET-FOOD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin: 20px;
            min-height: calc(100vh - 40px);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }
        .settings-section {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1><i class="fas fa-cog"></i> Kitchen Settings</h1>
            <p class="mb-0">Configure kitchen preferences and system settings</p>
        </div>

        <div class="p-4">
            <!-- Navigation -->
            <div class="row mb-4">
                <div class="col-12">
                    <nav class="nav nav-pills nav-fill">
                        <a class="nav-link" href="/kitchen/food-management">
                            <i class="fas fa-utensils"></i> Food Management
                        </a>
                        <a class="nav-link" href="/kitchen/orders">
                            <i class="fas fa-clipboard-list"></i> Orders
                        </a>
                        <a class="nav-link" href="/kitchen/analytics">
                            <i class="fas fa-chart-bar"></i> Analytics
                        </a>
                        <a class="nav-link active" href="/kitchen/settings">
                            <i class="fas fa-cog"></i> Settings
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Settings Sections -->
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="settings-section card">
                        <div class="card-header">
                            <h5><i class="fas fa-user"></i> Account Settings</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" value="kitchen" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Role</label>
                                <input type="text" class="form-control" value="Kitchen Staff" readonly>
                            </div>
                            <button class="btn btn-outline-primary">Change Password</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="settings-section card">
                        <div class="card-header">
                            <h5><i class="fas fa-bell"></i> Notifications</h5>
                        </div>
                        <div class="card-body">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="orderNotifications" checked>
                                <label class="form-check-label" for="orderNotifications">
                                    New Order Notifications
                                </label>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="soundNotifications" checked>
                                <label class="form-check-label" for="soundNotifications">
                                    Sound Notifications
                                </label>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="autoRefresh" checked>
                                <label class="form-check-label" for="autoRefresh">
                                    Auto-refresh Orders (30s)
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="settings-section card">
                        <div class="card-header">
                            <h5><i class="fas fa-clock"></i> Kitchen Hours</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-6">
                                    <label class="form-label">Opening Time</label>
                                    <input type="time" class="form-control" value="08:00">
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Closing Time</label>
                                    <input type="time" class="form-control" value="22:00">
                                </div>
                            </div>
                            <div class="mt-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="enableBreakTime">
                                    <label class="form-check-label" for="enableBreakTime">
                                        Enable Break Time
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="settings-section card">
                        <div class="card-header">
                            <h5><i class="fas fa-tools"></i> System</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Default Order Status</label>
                                <select class="form-select">
                                    <option value="pending">Pending</option>
                                    <option value="confirmed" selected>Confirmed</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Preparation Time (minutes)</label>
                                <input type="number" class="form-control" value="15" min="5" max="60">
                            </div>
                            <button class="btn btn-outline-danger" onclick="confirmLogout()">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- System Information -->
            <div class="row">
                <div class="col-12">
                    <div class="settings-section card">
                        <div class="card-header">
                            <h5><i class="fas fa-info-circle"></i> System Information</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-3">
                                    <strong>Application:</strong><br>
                                    ET-FOOD Kitchen System
                                </div>
                                <div class="col-md-3">
                                    <strong>Version:</strong><br>
                                    1.0.0
                                </div>
                                <div class="col-md-3">
                                    <strong>Last Updated:</strong><br>
                                    July 21, 2025
                                </div>
                                <div class="col-md-3">
                                    <strong>Database:</strong><br>
                                    <span class="text-success">Connected</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function confirmLogout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = '/kitchen/logout';
            }
        }

        // Save settings functionality can be added here
        function saveSettings() {
            // Implement settings save functionality
            alert('Settings saved successfully!');
        }
    </script>
</body>
</html>
