<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ET-FOOD - Ethiopian Food Delivery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }

        .search-bar {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 16px;
            backdrop-filter: blur(10px);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }

        .categories {
            margin-bottom: 30px;
        }

        .categories h2 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .category-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .category-card.active {
            background: #3b82f6;
        }

        .category-icon {
            font-size: 30px;
            margin-bottom: 10px;
            display: block;
        }

        .products {
            margin-bottom: 30px;
        }

        .products h2 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .product-price {
            font-size: 14px;
            color: #3b82f6;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-add, .btn-remove {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-add {
            background: #3b82f6;
            color: white;
            flex: 1;
        }

        .btn-add:hover {
            background: #2563eb;
        }

        .btn-remove {
            background: #ef4444;
            color: white;
            min-width: 32px;
        }

        .btn-remove:hover {
            background: #dc2626;
        }

        .quantity-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #3b82f6;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        .cart-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #3b82f6;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-weight: 600;
            z-index: 1000;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .category-grid,
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .category-card {
                padding: 15px;
            }
            
            .category-icon {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" class="search-input" placeholder="Search" id="searchInput">
            <span class="search-icon">🔍</span>
        </div>

        <!-- Categories -->
        <div class="categories">
            <h2>Categories</h2>
            <div class="category-grid">
                <div class="category-card" onclick="filterCategory('all')">
                    <span class="category-icon">🍽️</span>
                    <div>All</div>
                </div>
                <div class="category-card" onclick="filterCategory('burgers')">
                    <span class="category-icon">🍔</span>
                    <div>Burgers</div>
                </div>
                <div class="category-card" onclick="filterCategory('pizza')">
                    <span class="category-icon">🍕</span>
                    <div>Pizza</div>
                </div>
                <div class="category-card" onclick="filterCategory('drinks')">
                    <span class="category-icon">🥤</span>
                    <div>Drinks</div>
                </div>
                <div class="category-card" onclick="filterCategory('shawarma')">
                    <span class="category-icon">🌯</span>
                    <div>Shawarma</div>
                </div>
                <div class="category-card" onclick="filterCategory('traditional')">
                    <span class="category-icon">🍛</span>
                    <div>Ethiopian</div>
                </div>
            </div>
        </div>

        <!-- Products -->
        <div class="products">
            <h2>Products</h2>
            <div class="product-grid" id="productGrid">
                <!-- Products will be loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Cart Info -->
    <div class="cart-info" id="cartInfo" style="display: none;">
        Cart • <span id="cartTotal">0 ETB</span>
    </div>

    <script>
        let selectedItems = {};
        let menuItems = [];
        let currentCategory = 'all';

        // Initialize Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            
            // Set theme
            document.body.style.backgroundColor = tg.themeParams.bg_color || '#1a1a2e';
            document.body.style.color = tg.themeParams.text_color || '#ffffff';
            
            // Configure main button
            tg.MainButton.text = "Place Order";
            tg.MainButton.color = "#3b82f6";
            updateMainButton();
            
            tg.MainButton.onClick(() => {
                if (Object.keys(selectedItems).length > 0) {
                    showOrderForm();
                }
            });
        }

        // Load menu items on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadMenuItems();
        });

        // Load menu items
        async function loadMenuItems() {
            try {
                const response = await fetch('/api/menu');
                const data = await response.json();
                menuItems = data.menu_items || [];
                displayProducts();
            } catch (error) {
                console.error('Error loading menu:', error);
                menuItems = [];
            }
        }

        // Display products
        function displayProducts() {
            const grid = document.getElementById('productGrid');
            const filteredItems = currentCategory === 'all' ? 
                menuItems : 
                menuItems.filter(item => getCategoryForItem(item) === currentCategory);

            grid.innerHTML = '';
            
            filteredItems.forEach(item => {
                const priceETB = Math.round(item.price);
                const quantity = selectedItems[item.id] || 0;
                
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <img src="${item.image_url}" alt="${item.name}" class="product-image" onerror="this.src='data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"200\" height=\"120\" viewBox=\"0 0 200 120\"><rect width=\"200\" height=\"120\" fill=\"%2316213e\"/><text x=\"100\" y=\"60\" text-anchor=\"middle\" dy=\".3em\" fill=\"%23ffffff\" font-family=\"sans-serif\" font-size=\"14\">🍽️</text></svg>'">
                    <div class="product-info">
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">${priceETB} ETB</div>
                        <div class="product-buttons">
                            ${quantity > 0 ? `<button class="btn-remove" onclick="updateQuantity('${item.id}', -1)">-</button>` : ''}
                            <button class="btn-add" onclick="updateQuantity('${item.id}', 1)">
                                ${quantity > 0 ? `${quantity}` : 'ADD'}
                            </button>
                        </div>
                    </div>
                    ${quantity > 0 ? `<div class="quantity-badge">${quantity}</div>` : ''}
                `;
                
                grid.appendChild(productCard);
            });
        }

        // Get category for item
        function getCategoryForItem(item) {
            const category = item.category.toLowerCase();
            if (category.includes('burger')) return 'burgers';
            if (category.includes('pizza')) return 'pizza';
            if (category.includes('drink')) return 'drinks';
            if (category.includes('shawarma')) return 'shawarma';
            if (category.includes('traditional') || category.includes('ethiopian')) return 'traditional';
            return 'burgers'; // Default category
        }

        // Filter by category
        function filterCategory(category) {
            currentCategory = category;
            
            // Update active category
            document.querySelectorAll('.category-card').forEach(card => {
                card.classList.remove('active');
            });
            event.target.closest('.category-card').classList.add('active');
            
            displayProducts();
        }

        // Update item quantity
        function updateQuantity(itemId, change) {
            const currentQty = selectedItems[itemId] || 0;
            const newQty = Math.max(0, currentQty + change);
            
            if (newQty === 0) {
                delete selectedItems[itemId];
            } else {
                selectedItems[itemId] = newQty;
            }
            
            displayProducts();
            updateCartInfo();
            updateMainButton();
        }

        // Update cart info
        function updateCartInfo() {
            const cartInfo = document.getElementById('cartInfo');
            const cartTotal = document.getElementById('cartTotal');
            
            let total = 0;
            let itemCount = 0;
            
            for (let itemId in selectedItems) {
                const item = menuItems.find(m => m.id === itemId);
                if (item) {
                    total += item.price * selectedItems[itemId];
                    itemCount += selectedItems[itemId];
                }
            }
            
            if (itemCount > 0) {
                cartTotal.textContent = `${Math.round(total)} ETB`;
                cartInfo.style.display = 'block';
            } else {
                cartInfo.style.display = 'none';
            }
        }

        // Update Telegram main button
        function updateMainButton() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                const itemCount = Object.values(selectedItems).reduce((a, b) => a + b, 0);
                
                if (itemCount > 0) {
                    let total = 0;
                    for (let itemId in selectedItems) {
                        const item = menuItems.find(m => m.id === itemId);
                        if (item) {
                            total += item.price * selectedItems[itemId];
                        }
                    }
                    tg.MainButton.text = `Order (${Math.round(total)} ETB)`;
                    tg.MainButton.show();
                } else {
                    tg.MainButton.hide();
                }
            }
        }

        // Show order form
        function showOrderForm() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                const orderData = {
                    items: selectedItems,
                    menuItems: menuItems
                };
                tg.sendData(JSON.stringify(orderData));
            }
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            if (searchTerm) {
                const filtered = menuItems.filter(item => 
                    item.name.toLowerCase().includes(searchTerm) ||
                    item.description.toLowerCase().includes(searchTerm)
                );
                displayFilteredProducts(filtered);
            } else {
                displayProducts();
            }
        });

        function displayFilteredProducts(filtered) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            filtered.forEach(item => {
                const priceETB = Math.round(item.price);
                const quantity = selectedItems[item.id] || 0;
                
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <img src="${item.image_url}" alt="${item.name}" class="product-image" onerror="this.src='data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"200\" height=\"120\" viewBox=\"0 0 200 120\"><rect width=\"200\" height=\"120\" fill=\"%2316213e\"/><text x=\"100\" y=\"60\" text-anchor=\"middle\" dy=\".3em\" fill=\"%23ffffff\" font-family=\"sans-serif\" font-size=\"14\">🍽️</text></svg>'">
                    <div class="product-info">
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">${priceETB} ETB</div>
                        <div class="product-buttons">
                            ${quantity > 0 ? `<button class="btn-remove" onclick="updateQuantity('${item.id}', -1)">-</button>` : ''}
                            <button class="btn-add" onclick="updateQuantity('${item.id}', 1)">
                                ${quantity > 0 ? `${quantity}` : 'ADD'}
                            </button>
                        </div>
                    </div>
                    ${quantity > 0 ? `<div class="quantity-badge">${quantity}</div>` : ''}
                `;
                
                grid.appendChild(productCard);
            });
        }
    </script>
</body>
</html>
