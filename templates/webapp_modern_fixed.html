<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botifi Food - Order Now</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .language-selector {
            background: #16213e;
            border: none;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .search-bar {
            position: relative;
            margin-bottom: 30px;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            background: #16213e;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        
        .search-input::placeholder {
            color: #6b7280;
        }
        
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }
        
        .categories {
            margin-bottom: 30px;
        }
        
        .categories h2 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .category-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            background: linear-gradient(135deg, #16213e, #0f172a);
            border: 1px solid #374151;
        }
        
        .category-card:hover {
            transform: scale(1.05);
        }
        
        .category-burgers {
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
        }
        
        .category-snacks {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
        }
        
        .category-sauces {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
        }
        
        .category-drinks {
            background: linear-gradient(135deg, #fce7f3, #fbcfe8);
        }
        
        .category-icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }
        
        .category-name {
            color: #ffffff;
            font-weight: 500;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .products {
            margin-bottom: 100px;
        }
        
        .products h2 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .product-card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        
        .product-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        
        .product-info {
            padding: 15px;
        }
        
        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #ffffff;
        }
        
        .product-price {
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .product-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn-remove {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            width: 35px;
            height: 35px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-add {
            background: #f97316;
            color: white;
            border: none;
            border-radius: 8px;
            flex: 1;
            height: 35px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .cart-info {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #3b82f6;
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            z-index: 1000;
        }
        
        .quantity-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #f97316;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
        
        .language-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .language-modal.show {
            display: flex;
        }
        
        .language-modal-content {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 300px;
        }
        
        .language-option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        
        .language-option:hover {
            background: #1a1a2e;
        }
        
        .language-option.selected {
            background: #3b82f6;
        }
        
        .flag {
            font-size: 20px;
        }
        
        .hidden {
            display: none;
        }

        .place-order-btn {
            width: 100%;
            padding: 15px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .place-order-btn:hover {
            background: #2563eb;
        }

        .place-order-btn:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }
        
        /* Profile Modal Styles */
        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .profile-modal-content {
            background: #1e293b;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .profile-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #334155;
        }
        
        .profile-modal-header h3 {
            margin: 0;
            color: #f8fafc;
        }
        
        .profile-close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }
        
        .profile-modal-body {
            padding: 20px;
        }
        
        .profile-section {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .profile-avatar-large {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 16px;
        }
        
        .profile-info-details h4 {
            margin: 0 0 4px 0;
            color: #f8fafc;
            font-size: 18px;
        }
        
        .profile-info-details p {
            margin: 2px 0;
            color: #94a3b8;
            font-size: 14px;
        }
        
        .profile-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .profile-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .profile-btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .profile-btn-primary:hover {
            background: #2563eb;
        }
        
        .profile-btn-secondary {
            background: #374151;
            color: #f3f4f6;
        }
        
        .profile-btn-secondary:hover {
            background: #4b5563;
        }
        
        .profile-info {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .profile-info:hover {
            opacity: 0.8;
        }
        
        /* Checkout Modal Styles */
        .checkout-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .checkout-modal-content {
            background: #16213e;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .checkout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #374151;
        }
        
        .checkout-header h3 {
            margin: 0;
            color: #ffffff;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .checkout-body {
            padding: 20px;
        }
        
        .order-summary {
            margin-bottom: 20px;
        }
        
        .order-summary h4 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .order-items {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: #d1d5db;
        }
        
        .order-item:last-child {
            margin-bottom: 0;
        }
        
        .order-total {
            text-align: right;
            color: #ffffff;
            font-size: 18px;
        }
        
        .customer-info {
            margin-bottom: 20px;
        }
        
        .customer-info h4 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .customer-info input,
        .customer-info textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #374151;
            border-radius: 8px;
            background: #1a1a2e;
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .address-container {
            position: relative;
        }
        
        .location-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s ease;
            z-index: 10;
        }
        
        .location-btn:hover {
            background: #2563eb;
        }
        
        .location-btn.success {
            background: #10b981;
        }
        
        .customer-info input::placeholder,
        .customer-info textarea::placeholder {
            color: #6b7280;
        }
        
        .payment-options {
            margin-bottom: 20px;
        }
        
        .payment-options h4 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .payment-method {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #374151;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .payment-method:hover {
            border-color: #3b82f6;
        }
        
        .payment-method input[type="radio"] {
            margin-right: 10px;
        }
        
        .payment-method.checked {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }
        
        .payment-icon {
            font-size: 20px;
            margin-right: 10px;
        }
        
        .payment-method span:last-child {
            color: #ffffff;
            font-weight: 500;
        }
        
        .payment-details {
            margin-top: 15px;
        }
        
        .payment-details .form-label {
            color: #ffffff;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .payment-details input[type="text"],
        .payment-details input[type="file"] {
            margin-bottom: 10px;
        }
        
        .payment-details input[type="text"]::placeholder {
            color: #6b7280;
        }
        
        .payment-instructions {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid #3b82f6;
            border-radius: 6px;
            padding: 10px;
            margin: 10px 0;
            color: #ffffff;
            font-size: 14px;
        }
        
        .place-order-btn {
            width: 100%;
            padding: 15px;
            background: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .place-order-btn:hover {
            background: #2563eb;
        }
        
        .checkout-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .checkout-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        
        .cart-info {
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        
        .cart-info:hover {
            opacity: 0.8;
        }

        /* Order History Modal Styles */
        .order-history-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .order-history-content {
            background: #0f172a;
            border-radius: 12px;
            padding: 0;
            width: 95%;
            max-width: 400px;
            max-height: 85vh;
            overflow: hidden;
            border: 1px solid #374151;
        }

        .order-history-header {
            background: linear-gradient(135deg, #16213e, #0f172a);
            padding: 12px 16px;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-history-header h3 {
            color: #ffffff;
            margin: 0;
            font-size: 16px;
        }

        .order-history-close {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .order-history-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .order-history-body {
            padding: 12px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .order-item {
            background: #1e293b;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #374151;
        }

        .order-item:last-child {
            margin-bottom: 0;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .order-id {
            font-weight: 600;
            color: #3b82f6;
            font-size: 13px;
        }

        .order-status {
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fbbf24;
            color: #92400e;
        }

        .status-confirmed {
            background: #3b82f6;
            color: #ffffff;
        }

        .status-preparing {
            background: #f59e0b;
            color: #ffffff;
        }

        .status-out_for_delivery {
            background: #8b5cf6;
            color: #ffffff;
        }

        .status-delivered {
            background: #10b981;
            color: #ffffff;
        }

        .status-cancelled {
            background: #ef4444;
            color: #ffffff;
        }

        .order-details {
            color: #e5e7eb;
            font-size: 11px;
            margin-bottom: 6px;
            display: flex;
            gap: 12px;
        }

        .order-items {
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .order-total {
            font-weight: 600;
            color: #3b82f6;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .order-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .order-action-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            transition: background 0.3s;
            flex: 1;
        }

        .btn-track {
            background: #3b82f6;
            color: #ffffff;
        }

        .btn-track:hover {
            background: #2563eb;
        }

        .btn-reorder {
            background: #16a34a;
            color: #ffffff;
        }

        .btn-reorder:hover {
            background: #15803d;
        }

        .btn-cancel {
            background: #ef4444;
            color: #ffffff;
        }

        .btn-cancel:hover {
            background: #dc2626;
        }

        .no-orders {
            text-align: center;
            color: #9ca3af;
            padding: 40px 20px;
        }

        .no-orders-icon {
            font-size: 48px;
        }

        /* Ultra Compact Order History Styles */
        .order-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            margin-bottom: 8px;
            padding: 8px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .order-info {
            flex: 1;
        }

        .order-number {
            color: #3b82f6;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 1px;
        }

        .order-date {
            color: #9ca3af;
            font-size: 10px;
        }

        .order-status-price {
            text-align: right;
        }

        .order-total {
            color: #3b82f6;
            font-size: 13px;
            font-weight: 600;
            margin-top: 2px;
        }

        .order-items {
            margin-bottom: 6px;
            max-height: 60px;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e5e7eb;
            font-size: 11px;
            padding: 1px 0;
            line-height: 1.2;
        }

        .item-row span:first-child {
            color: #d1d5db;
            max-width: 65%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-row span:last-child {
            color: #9ca3af;
            font-weight: 500;
            font-size: 10px;
        }

        .order-actions {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }

        .order-action-btn {
            padding: 3px 6px;
            border: none;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
            transition: background 0.3s;
            flex: 1;
            min-width: 0;
        }
            margin-bottom: 15px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .category-grid,
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .category-card {
                padding: 15px;
            }
            
            .category-icon {
                font-size: 24px;
            }
            
            .checkout-modal {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with Profile and Language -->
        <div class="header">
            <div class="profile-info" onclick="showUserProfile()">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <div>
                    <div style="font-size: 14px; color: #6b7280;" id="profileName">Profile</div>
                    <div style="font-size: 12px; color: #9ca3af;" id="profilePhone"></div>
                </div>
            </div>
            <select class="language-selector" id="languageSelector" onchange="changeLanguage()">
                <option value="en">🇬🇧 English</option>
                <option value="am">🇪🇹 አማርኛ</option>
                <option value="or">🇪🇹 Afaan Oromoo</option>
                <option value="ti">🇪🇹 ትግርኛ</option>
            </select>
        </div>

        <!-- User Profile Modal -->

    <script>
        let selectedItems = {};
        let menuItems = [];
        let currentCategory = 'all';
        let currentLanguage = 'en';

        // Translation object
        const translations = {
            en: {
                categories: 'Categories',
                products: 'Products',
                burgers: 'Burgers',
                snacks: 'Snacks',
                sauces: 'Sauces',

                categories: 'ምድቦች',

                snacks: 'መክሰስ',
                sauces: 'ሳውሶች',
                drinks: 'መጠጦች',
                cart: 'ዕቃ መያዣ',
                search: 'ፈልግ',
                add: 'ጨምር'
            },
            or: {

                snacks: 'Nyaata Salphaa',
                sauces: 'Sausii',
                drinks: 'Dhugaatii',
                cart: 'Saandugaa',
                search: 'Barbaadi',
                add: 'IDA\'I'
            },
            ti: {
                categories: 'ምድባት',
                products: 'ፍርያት',
                burgers: 'በርገራት',
                snacks: 'መክሰሳት',
                sauces: 'ሳውሳት',
                drinks: 'መስተይት',
                cart: 'መኻዘን',
                search: 'ደልይ',
                add: 'ወስኽ'
            }
        };

        // Initialize Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            
            // Set theme
            document.body.style.backgroundColor = tg.themeParams.bg_color || '#1a1a2e';
            document.body.style.color = tg.themeParams.text_color || '#ffffff';
            
            // Configure main button
            tg.MainButton.text = "Place Order";
            tg.MainButton.color = "#3b82f6";
            
            // Handle main button click
            tg.MainButton.onClick(() => {
                if (Object.keys(selectedItems).length > 0) {
                    showOrderForm();
                }
            });
            updateMainButton();
        }

        // Change language
        function changeLanguage() {
            const selector = document.getElementById('languageSelector');
            currentLanguage = selector.value;
            updateTexts();
            displayProducts();
        }

        // Update texts based on current language
        function updateTexts() {
            const t = translations[currentLanguage];
            const elements = [
                { id: 'categoriesTitle', text: t.categories },
                { id: 'productsTitle', text: t.products },
                { id: 'categoryBurgers', text: t.burgers },
                { id: 'categorySnacks', text: t.snacks },
                { id: 'categorySauces', text: t.sauces },
                { id: 'categoryDrinks', text: t.drinks },
                { id: 'cartText', text: t.cart }
            ];
            
            elements.forEach(({ id, text }) => {
                const element = document.getElementById(id);
                if (element) element.textContent = text;
            });
            
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.placeholder = t.search;
        }

        // Load menu items
        async function loadMenuItems() {
            try {
                const response = await fetch('/api/menu');
                menuItems = await response.json();
                displayProducts();
            } catch (error) {
                console.error('Error loading menu:', error);
            }
        }

        // Display products
        function displayProducts() {
            const grid = document.getElementById('productGrid');
            if (!grid) return;
            
            let filteredItems;
            if (currentCategory === 'all') {
                filteredItems = menuItems;
            } else {
                // Create a mapping for category names to handle different naming conventions
                const categoryMapping = {
                    'burgers': 'Burgers',
                    'snacks': ['Snacks', 'Fries & Pancakes'],
                    'sauces': ['Sauces', 'Extras'], 
                    'drinks': 'Drinks',
                    'shawarma': 'Shawarma',
                    'sandwiches & wraps': 'Sandwiches & Wraps',
                    'pizza': 'Pizza',
                    'pasta': 'Pasta',
                    'rice dishes': 'Rice Dishes',
                    'egg dishes & toast': 'Egg Dishes & Toast',
                    'traditional ethiopian breakfast': 'Traditional Ethiopian Breakfast',
                    'borrito': 'Borrito'
                };
                
                // Get the actual category names to filter by
                let categoriesToFilter = categoryMapping[currentCategory.toLowerCase()];
                if (!categoriesToFilter) {
                    // Try to find exact match or partial match
                    categoriesToFilter = currentCategory;
                }
                if (!Array.isArray(categoriesToFilter)) {
                    categoriesToFilter = [categoriesToFilter];
                }
                
                filteredItems = menuItems.filter(item => {
                    if (!item.category) return false;
                    return categoriesToFilter.some(cat => 
                        item.category.toLowerCase().includes(cat.toLowerCase()) || 
                        cat.toLowerCase().includes(item.category.toLowerCase()) ||
                        item.category.toLowerCase() === currentCategory.toLowerCase()
                    );
                });
            }

            grid.innerHTML = '';
            
            filteredItems.forEach(item => {
                const priceETB = Math.round(item.price); // Price is already in ETB
                const quantity = selectedItems[item.id] || 0;
                
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                
                const fallbackImage = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMTIwIiB2aWV3Qm94PSIwIDAgMjAwIDEyMCI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIxMjAiIGZpbGw9IiMxNjIxM2UiLz48dGV4dCB4PSIxMDAiIHk9IjYwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSIgZmlsbD0iI2ZmZmZmZiIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiPvCfjaU8L3RleHQ+PC9zdmc+';
                
                productCard.innerHTML = `
                    <img src="${item.image_url}" alt="${item.name}" class="product-image" onerror="this.src='${fallbackImage}'">
                    <div class="product-info">
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">${priceETB.toLocaleString()} ETB</div>
                        <div class="product-buttons">
                            ${quantity > 0 ? `<button class="btn-remove" onclick="updateQuantity(${item.id}, -1)">-</button>` : ''}
                            <button class="btn-add" onclick="updateQuantity(${item.id}, 1)">
                                ${quantity > 0 ? quantity : translations[currentLanguage].add}
                            </button>
                        </div>
                    </div>
                    ${quantity > 0 ? `<div class="quantity-badge">${quantity}</div>` : ''}
                `;
                
                grid.appendChild(productCard);
            });
        }

        // Filter by category
        function filterCategory(category) {
            currentCategory = category;
            displayProducts();
        }

        // Update item quantity
        function updateQuantity(itemId, change) {
            const currentQty = selectedItems[itemId] || 0;
            const newQty = Math.max(0, currentQty + change);
            
            if (newQty === 0) {
                delete selectedItems[itemId];
            } else {
                selectedItems[itemId] = newQty;
            }
            
            displayProducts();
            updateCartInfo();
            updateMainButton();
        }

        // Update cart info
        function updateCartInfo() {
            const cartInfo = document.getElementById('cartInfo');
            const cartTotal = document.getElementById('cartTotal');
            
            const totalItems = Object.values(selectedItems).reduce((sum, qty) => sum + qty, 0);
            const totalPrice = Object.keys(selectedItems).reduce((sum, itemId) => {
                const item = menuItems.find(i => i.id == itemId);
                const qty = selectedItems[itemId];
                return sum + (item ? item.price * qty : 0);
            }, 0);
            
            if (totalItems > 0) {
                cartTotal.textContent = `${Math.round(totalPrice).toLocaleString()} ETB`;
                cartInfo.style.display = 'block';
            } else {
                cartInfo.style.display = 'none';
            }
        }

        // Update main button
        function updateMainButton() {
            const totalItems = Object.values(selectedItems).reduce((sum, qty) => sum + qty, 0);
            
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                
                if (totalItems > 0) {
                    tg.MainButton.show();
                    tg.MainButton.enable();
                } else {
                    tg.MainButton.hide();
                }
            } else {
                // For non-Telegram users, show checkout button
                const checkoutBtn = document.getElementById('checkoutBtn');
                if (checkoutBtn) {
                    checkoutBtn.style.display = totalItems > 0 ? 'block' : 'none';
                }
            }
        }

        // Show order form
        async function showOrderForm() {
            // Create order data
            const orderItems = [];
            let totalAmount = 0;
            
            Object.keys(selectedItems).forEach(itemId => {
                const item = menuItems.find(i => i.id == itemId);
                const quantity = selectedItems[itemId];
                if (item && quantity > 0) {
                    const itemTotal = item.price * quantity; // Price already in ETB
                    orderItems.push({
                        id: item.id,
                        name: item.name,
                        price: item.price,
                        quantity: quantity,
                        total: itemTotal
                    });
                    totalAmount += itemTotal;
                }
            });

            // Get user data from Telegram and database
            let userData = {
                telegram_user_id: 'demo_user',
                customer_name: '',
                customer_phone: ''
            };
            
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe.user) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                userData = {
                    telegram_user_id: user.id,
                    customer_name: `${user.first_name} ${user.last_name || ''}`.trim(),
                    customer_phone: ''
                };
                
                // Fetch user profile from database to get contact information saved from bot
                try {
                    const response = await fetch(`/api/user-profile/${user.id}`);
                    const profile = await response.json();
                    if (profile.success && profile.phone_number) {
                        userData.customer_phone = profile.phone_number;
                    }
                } catch (error) {
                    console.log('Could not fetch user profile:', error);
                }
            }

            // Show checkout modal with complete user data
            showCheckoutModal({
                ...userData,
                items: orderItems,
                total_amount: totalAmount
            });
        }

        // Show checkout modal with payment options
        function showCheckoutModal(orderData) {
            const modal = document.createElement('div');
            modal.className = 'checkout-modal';
            modal.innerHTML = `
                <div class="checkout-modal-content">
                    <div class="checkout-header">
                        <h3>🛒 Checkout</h3>
                        <button onclick="closeCheckoutModal()" class="close-btn">✕</button>
                    </div>
                    <div class="checkout-body">
                        <div class="order-summary">
                            <h4>Order Summary</h4>
                            <div class="order-items">
                                ${orderData.items.map(item => `
                                    <div class="order-item">
                                        <span>${item.name} x${item.quantity}</span>
                                        <span>${Math.round(item.total)} ETB</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="order-total">
                                <strong>Total: ${Math.round(orderData.total_amount)} ETB</strong>
                            </div>
                        </div>
                        
                        <div class="customer-info">
                            <h4>Customer Information</h4>
                            <input type="text" id="customerName" placeholder="Full Name" value="${orderData.customer_name || ''}" required>
                            <input type="tel" id="customerPhone" placeholder="Phone Number" value="${orderData.customer_phone || ''}" required>
                            <div class="address-container">
                                <textarea id="customerAddress" placeholder="Delivery Address" rows="3" required></textarea>
                                <button type="button" class="location-btn" onclick="shareLocationInCheckout()" title="Share Live Location">
                                    📍 Share Location
                                </button>
                            </div>
                        </div>
                        
                        <div class="payment-options">
                            <h4>Payment Method</h4>
                            <div class="payment-methods">
                                <label class="payment-method">
                                    <input type="radio" name="paymentMethod" value="cash_on_delivery" checked>
                                    <span class="payment-icon">💵</span>
                                    <span>Cash on Delivery</span>
                                </label>
                                <label class="payment-method">
                                    <input type="radio" name="paymentMethod" value="telebirr">
                                    <span class="payment-icon">💰</span>
                                    <span>TeleBirr</span>
                                </label>
                                <label class="payment-method">
                                    <input type="radio" name="paymentMethod" value="cbe_birr">
                                    <span class="payment-icon">🏛️</span>
                                    <span>CBE Birr</span>
                                </label>
                                <label class="payment-method">
                                    <input type="radio" name="paymentMethod" value="mpessa">
                                    <span class="payment-icon">📱</span>
                                    <span>M-Pesa</span>
                                </label>
                                <label class="payment-method">
                                    <input type="radio" name="paymentMethod" value="bank_transfer">
                                    <span class="payment-icon">🏦</span>
                                    <span>Bank Transfer</span>
                                </label>
                            </div>
                            
                            <!-- Payment Details Section (Hidden by default) -->
                            <div id="paymentDetails" class="payment-details" style="display: none;">
                                <div class="mt-3 p-3" style="background: #16213e; border-radius: 8px;">
                                    <h5 id="paymentMethodTitle">Payment Details</h5>
                                    <div id="paymentInstructions"></div>
                                    
                                    <div class="mt-3">
                                        <label for="transactionId" class="form-label">Transaction ID</label>
                                        <input type="text" id="transactionId" class="form-control" placeholder="Enter transaction ID" style="background: #1a1a2e; border: 1px solid #374151; color: #ffffff;">
                                    </div>
                                    
                                    <div class="mt-3">
                                        <label for="transactionImage" class="form-label">Payment Screenshot</label>
                                        <input type="file" id="transactionImage" class="form-control" accept="image/*" style="background: #1a1a2e; border: 1px solid #374151; color: #ffffff;">
                                        <div id="imagePreview" class="mt-2" style="display: none;">
                                            <img id="previewImg" style="max-width: 200px; max-height: 200px; border-radius: 8px;">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="checkout-actions">
                            <button onclick="placeOrder()" class="place-order-btn" id="modalPlaceOrderBtn">
                                Place Order - ${Math.round(orderData.total_amount)} ETB
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Store order data for later use
            window.currentOrderData = orderData;
            
            // Hide Telegram WebApp main button when checkout modal is open
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.MainButton.hide();
            }
            
            // Add event listeners for payment method selection
            setTimeout(() => {
                const paymentMethods = document.querySelectorAll('input[name="paymentMethod"]');
                paymentMethods.forEach(method => {
                    method.addEventListener('change', function() {
                        // Update visual selection
                        document.querySelectorAll('.payment-method').forEach(label => {
                            label.classList.remove('checked');
                        });
                        this.closest('.payment-method').classList.add('checked');
                        
                        // Show/hide payment details based on selection
                        updatePaymentDetails(this.value);
                    });
                });
                
                // Set initial selection
                const checkedMethod = document.querySelector('input[name="paymentMethod"]:checked');
                if (checkedMethod) {
                    checkedMethod.closest('.payment-method').classList.add('checked');
                    updatePaymentDetails(checkedMethod.value);
                }
                
                // Add image preview functionality
                const imageInput = document.getElementById('transactionImage');
                if (imageInput) {
                    imageInput.addEventListener('change', function(e) {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                const preview = document.getElementById('imagePreview');
                                const img = document.getElementById('previewImg');
                                img.src = e.target.result;
                                preview.style.display = 'block';
                            };
                            reader.readAsDataURL(file);
                        } else {
                            document.getElementById('imagePreview').style.display = 'none';
                        }
                    });
                }
            }, 100);
        }

        // Close checkout modal
        function closeCheckoutModal() {
            const modal = document.querySelector('.checkout-modal');
            if (modal) {
                modal.remove();
            }
            
            // Restore main button when modal is closed
            if (window.Telegram && window.Telegram.WebApp) {
                updateMainButton();
            }
        }

        // Update payment details based on selected method
        function updatePaymentDetails(paymentMethod) {
            const detailsDiv = document.getElementById('paymentDetails');
            const titleElement = document.getElementById('paymentMethodTitle');
            const instructionsElement = document.getElementById('paymentInstructions');

            if (paymentMethod === 'cash_on_delivery') {
                detailsDiv.style.display = 'none';
                return;
            }

            detailsDiv.style.display = 'block';
            
            const paymentInfo = {

                'cbe_birr': {
                    title: 'CBE Birr Payment',
                    instructions: `
                        <div class="payment-instructions">
                            <strong>Pay using CBE Birr:</strong><br>
                            • Account: 1000123456789<br>
                            • Name: ET-FOOD Restaurant<br>
                            • Send the exact amount shown above<br>

                    `
                },
                'mpessa': {
                    title: 'M-Pesa Payment',
                    instructions: `
                        <div class="payment-instructions">
                            <strong>Pay using M-Pesa:</strong><br>

                            • Enter the transaction ID below

                    `
                },
                'bank_transfer': {

                    instructions: `
                        <div class="payment-instructions">
                            <strong>Bank Transfer Details:</strong><br>

        // Place order with selected payment method
        async function placeOrder() {
            const customerName = document.getElementById('customerName').value.trim();
            const customerPhone = document.getElementById('customerPhone').value.trim();
            const customerAddress = document.getElementById('customerAddress').value.trim();
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            
            if (!customerName || !customerPhone || !customerAddress) {
                alert('Please fill in all required fields');
                return;
            }

            // Only require transaction details for non-cash payment methods
            if (paymentMethod !== 'cash_on_delivery') {
                const transactionId = document.getElementById('transactionId').value.trim();
                const transactionImage = document.getElementById('transactionImage').files[0];
                
                if (!transactionId) {
                    alert('Please enter the transaction ID for this payment method');
                    return;
                }
                
                if (!transactionImage) {
                    alert('Please upload a screenshot of your payment');
                    return;
                }
            }

            // Get telegram user ID  
            let telegramUserId = 123456789; // Default fallback
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe.user) {
                telegramUserId = window.Telegram.WebApp.initDataUnsafe.user.id;
            }

            const orderData = {
                ...window.currentOrderData,
                telegram_user_id: telegramUserId,
                customer_name: customerName,
                customer_phone: customerPhone,
                customer_address: customerAddress,
                payment_method: paymentMethod,
                location_lat: window.currentOrderLocation?.latitude,
                location_lng: window.currentOrderLocation?.longitude
            };

            // Add payment details only for non-cash methods
            if (paymentMethod !== 'cash_on_delivery') {
                orderData.transaction_id = document.getElementById('transactionId').value.trim();
                orderData.transaction_image = document.getElementById('transactionImage').files[0];
            }

            await submitOrder(orderData);
        }

        // Submit order
        async function submitOrder(orderData) {
            try {
                console.log('Submitting order data:', orderData);
                
                // Show loading state
                const placeOrderBtn = document.querySelector('.place-order-btn');
                if (placeOrderBtn) {
                    placeOrderBtn.textContent = 'Placing Order...';
                    placeOrderBtn.disabled = true;
                }

                // Handle file upload if present (only for non-cash payments)
                if (orderData.transaction_image) {
                    // First upload the image
                    const formData = new FormData();
                    formData.append('file', orderData.transaction_image);
                    
                    const uploadResponse = await fetch('/api/upload-image', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (uploadResponse.ok) {
                        const uploadResult = await uploadResponse.json();
                        orderData.transaction_image_url = uploadResult.image_url;
                    } else {
                        throw new Error('Failed to upload payment screenshot');
                    }
                    
                    // Remove the file object from orderData
                    delete orderData.transaction_image;
                }

                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                console.log('Response status:', response.status);
                const responseText = await response.text();
                console.log('Response text:', responseText);

                if (response.ok) {
                    const result = JSON.parse(responseText);
                    console.log('Order created successfully:', result);
                    
                    // Clear cart
                    selectedItems = {};
                    displayProducts();
                    updateCartInfo();
                    updateMainButton();
                    
                    // Close checkout modal
                    closeCheckoutModal();
                    
                    // Show success message
                    const paymentMethodText = {
                        'cash_on_delivery': 'Cash on Delivery',
                        'telebirr': 'TeleBirr',
                        'cbe_birr': 'CBE Birr',
                        'mpessa': 'M-Pesa',
                        'bank_transfer': 'Bank Transfer'
                    }[orderData.payment_method] || 'Cash on Delivery';
                    
                    const successMessage = `Order #${result.order_id} placed successfully!\nTotal: ${Math.round(orderData.total_amount)} ETB\nPayment: ${paymentMethodText}`;
                    
                    // Use simple alert for compatibility with all Telegram WebApp versions
                    alert(successMessage);
                } else {
                    const errorText = await response.text();
                    console.log('Server response:', errorText);
                    
                    // Try to parse as JSON, if fails just use the text
                    let errorMessage = 'Failed to submit order';
                    try {
                        const errorData = JSON.parse(errorText);
                        errorMessage = errorData.error || errorMessage;
                    } catch (e) {
                        errorMessage = errorText || errorMessage;
                    }
                    
                    throw new Error(errorMessage);
                }
            } catch (error) {
                console.error('Error submitting order:', error);
                
                // Check if this is just a Telegram API compatibility issue
                const errorStr = error.toString();
                if (errorStr.includes('showPopup') || errorStr.includes('showAlert') || errorStr.includes('Method') || Object.keys(error).length === 0) {
                    // This is likely just a UI method error, order was probably successful
                    console.log('Telegram API compatibility issue detected, treating as success');
                    
                    // Clear cart and show success
                    selectedItems = {};
                    displayProducts();
                    updateCartInfo();
                    updateMainButton();
                    closeCheckoutModal();
                    alert('Order placed successfully!');
                    return;
                }
                
                // Reset button state for real errors
                const placeOrderBtn = document.querySelector('.place-order-btn');
                if (placeOrderBtn) {
                    placeOrderBtn.textContent = `Place Order - ${Math.round(orderData.total_amount)} ETB`;
                    placeOrderBtn.disabled = false;
                }
                
                // Show error for real failures
                alert('Failed to place order. Please try again.');
            }
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            if (searchTerm) {
                const filteredItems = menuItems.filter(item => 
                    item.name.toLowerCase().includes(searchTerm) ||
                    item.description.toLowerCase().includes(searchTerm)
                );
                
                displayFilteredProducts(filteredItems);
            } else {
                displayProducts();
            }
        });

                            ${quantity > 0 ? `<button class="btn-remove" onclick="updateQuantity(${item.id}, -1)">-</button>` : ''}
                            <button class="btn-add" onclick="updateQuantity(${item.id}, 1)">
                                ${quantity > 0 ? quantity : translations[currentLanguage].add}
