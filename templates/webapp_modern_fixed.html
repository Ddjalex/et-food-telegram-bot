        // Order tracking functionality
        let currentOrderId = null;
        let trackingInterval = null;

        function startOrderTracking(orderId) {
            currentOrderId = orderId;
            
            // Check order status every 30 seconds
            trackingInterval = setInterval(() => {
                checkOrderStatus(orderId);
            }, 30000);
            
            // Initial check
            checkOrderStatus(orderId);
        }

        function checkOrderStatus(orderId) {
            fetch(`/api/orders/${orderId}`)
                .then(response => response.json())
                .then(order => {
                    // If driver is assigned and out for delivery, track location
                    if (order.status === 'out_for_delivery' && order.driver_id) {
                        trackDriverLocation(orderId);
                    }
                    
                    // Stop tracking if order is delivered or cancelled
                    if (order.status === 'delivered' || order.status === 'cancelled') {
                        stopOrderTracking();
                    }
                })
                .catch(error => console.error('Error checking order status:', error));
        }

        function trackDriverLocation(orderId) {
            fetch(`/api/orders/${orderId}/driver-location`)
                .then(response => response.json())
                .then(data => {
                    if (!data.error) {
                        // Notify user about driver location update
                        const lastUpdate = data.location.last_update ? 
                            new Date(data.location.last_update).toLocaleTimeString() : 'Unknown';
                        
                        if (window.Telegram && window.Telegram.WebApp) {
                            // You can show a subtle notification or update UI
                            console.log(`Driver ${data.driver_name} location updated at ${lastUpdate}`);
                        }
                    }
                })
                .catch(error => console.error('Error tracking driver:', error));
        }

        function stopOrderTracking() {
            if (trackingInterval) {
                clearInterval(trackingInterval);
                trackingInterval = null;
            }
        }

        // User Profile Management
        let currentUser = {};

        function loadUserProfile() {
            // Get user data from Telegram WebApp
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                currentUser = {
                    id: user.id,
                    first_name: user.first_name || '',
                    last_name: user.last_name || '',
                    username: user.username || '',
                    phone_number: user.phone_number || '',
                    language_code: user.language_code || 'en'
                };
                updateProfileDisplay();
                loadTelegramProfilePhoto(user.id);
            } else {
                // Set default user data if Telegram WebApp is not available
                currentUser = {
                    id: 'demo_user',
                    first_name: 'Demo',
                    last_name: 'User',
                    username: 'demo_user',
                    phone_number: '+1234567890',
                    language_code: 'en'
                };
                updateProfileDisplay();
            }
        }

        async function loadTelegramProfilePhoto(userId) {
            try {
                // Try Telegram's photo URL pattern
                const telegramPhotoUrl = `https://t.me/i/userpic/320/${userId}.jpg`;
                
                // Test if the image loads
                const img = new Image();
                img.crossOrigin = 'anonymous';
                
                img.onload = function() {
                    updateAvatarWithPhoto(telegramPhotoUrl);
                };
                
                img.onerror = function() {
                    // If Telegram photo fails, try alternative approach
                    tryAlternativePhotoMethod(userId);
                };
                
                img.src = telegramPhotoUrl;
                
            } catch (error) {
                console.log('Error loading Telegram profile photo:', error);
            }
        }

        function tryAlternativePhotoMethod(userId) {
            // Alternative: Use Telegram WebApp photo access if available
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe.user) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                
                // Some Telegram WebApps provide photo_url directly
                if (user.photo_url) {
                    updateAvatarWithPhoto(user.photo_url);
                    return;
                }
                
                // Try to access through Telegram WebApp API
                if (window.Telegram.WebApp.requestWriteAccess) {
                    window.Telegram.WebApp.requestWriteAccess(function(allowed) {
                        if (allowed) {
                            // Request user photo through Telegram API
                            requestUserPhoto(userId);
                        }
                    });
                }
            }
        }

        function requestUserPhoto(userId) {
            // Request photo through backend API
            fetch(`/api/telegram-user-photo/${userId}`)
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('Photo not available');
                })
                .then(data => {
                    if (data.photo_url) {
                        updateAvatarWithPhoto(data.photo_url);
                    }
                })
                .catch(error => {
                    console.log('Backend photo request failed:', error);
                });
        }

        function updateAvatarWithPhoto(photoUrl) {
            const avatar = document.getElementById('profileAvatar');
            const avatarLarge = document.getElementById('profileAvatarLarge');
            
            if (avatar) {
                avatar.innerHTML = `<img src="${photoUrl}" alt="Profile" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;" onerror="this.parentElement.textContent='👤'">`;
            }
            
            if (avatarLarge) {
                avatarLarge.innerHTML = `<img src="${photoUrl}" alt="Profile" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;" onerror="this.parentElement.textContent='👤'">`;
            }
        }

        function updateProfileDisplay() {
            const fullName = `${currentUser.first_name || ''} ${currentUser.last_name || ''}`.trim();
            const displayName = fullName || currentUser.username || 'Guest User';
            
            // Update header profile
            const profileNameElement = document.getElementById('profileName');
            const profilePhoneElement = document.getElementById('profilePhone');
            
            if (profileNameElement) {
                profileNameElement.textContent = displayName;
            }
            if (profilePhoneElement) {
                profilePhoneElement.textContent = currentUser.phone_number || '';
            }
            
            // Update modal profile
            const profileFullNameElement = document.getElementById('profileFullName');
            const profileUserPhoneElement = document.getElementById('profileUserPhone');
            const profileUserLanguageElement = document.getElementById('profileUserLanguage');
            
            if (profileFullNameElement) {
                profileFullNameElement.textContent = fullName || 'Guest User';
            }
            if (profileUserPhoneElement) {
                profileUserPhoneElement.textContent = currentUser.phone_number || 'No phone number';
            }
            
            // Update language display
            const languageMap = {
                'en': 'English',
                'am': 'አማርኛ (Amharic)',
                'or': 'Afaan Oromoo',
                'ti': 'ትግርኛ (Tigrinya)'
            };
            if (profileUserLanguageElement) {
                profileUserLanguageElement.textContent = languageMap[currentLanguage] || 'English';
            }
            
            // Generate avatar from first letter of name or use default
            const avatarElement = document.getElementById('profileAvatar');
            const avatarLargeElement = document.getElementById('profileAvatarLarge');
            
            if (currentUser.first_name && currentUser.first_name.length > 0) {
                const avatarLetter = currentUser.first_name.charAt(0).toUpperCase();
                if (avatarElement) avatarElement.textContent = avatarLetter;
                if (avatarLargeElement) avatarLargeElement.textContent = avatarLetter;
            } else {
                if (avatarElement) avatarElement.textContent = '👤';
                if (avatarLargeElement) avatarLargeElement.textContent = '👤';
            }
        }

        function showUserProfile() {
            updateProfileDisplay();
            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeUserProfile() {
            document.getElementById('profileModal').style.display = 'none';
        }

        function editProfile() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.showAlert('Profile editing will be available in a future update. You can manage your profile through Telegram settings.');
            } else {
                alert('Profile editing will be available in a future update.');
            }
        }

        async function viewOrderHistory() {
            // Close profile modal
            closeUserProfile();
            
            // Show order history modal
            document.getElementById('orderHistoryModal').style.display = 'flex';
            
            // Load order history
            await loadOrderHistory();
        }

        function closeOrderHistory() {
            document.getElementById('orderHistoryModal').style.display = 'none';
        }

        async function loadOrderHistory() {
            try {
                const orderHistoryBody = document.getElementById('orderHistoryBody');
                orderHistoryBody.innerHTML = '<div style="text-align: center; padding: 20px; color: #9ca3af;">Loading orders...</div>';
                
                // Get user ID from Telegram WebApp
                let userId = 123456789; // Default fallback
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    userId = window.Telegram.WebApp.initDataUnsafe.user.id;
                } else if (currentUser && currentUser.id && currentUser.id !== 'demo_user') {
                    userId = currentUser.id;
                }
                
                console.log('Loading order history for user:', userId);
                
                const response = await fetch(`/api/user-orders/${userId}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error:', response.status, errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const orders = await response.json();
                console.log('Loaded orders:', orders);
                
                if (!orders || orders.length === 0) {
                    orderHistoryBody.innerHTML = `
                        <div class="no-orders">
                            <div class="no-orders-icon">🛍️</div>
                            <h3>No orders yet</h3>
                            <p>Start browsing our menu and place your first order!</p>
                        </div>
                    `;
                    return;
                }
                
                // Display orders
                orderHistoryBody.innerHTML = orders.map(order => `
                    <div class="order-item">
                        <div class="order-header">
                            <div class="order-id">Order #${order.id}</div>
                            <div class="order-status status-${order.status}">${getStatusText(order.status)}</div>
                        </div>
                        <div class="order-details">
                            <div>📅 ${formatDate(order.created_at).split(' ')[0]}</div>
                            <div>💳 ${order.payment_method}</div>
                        </div>
                        <div class="order-items">
                            ${order.items.map(item => `${item.name} x${item.quantity}`).slice(0, 2).join(', ')}${order.items.length > 2 ? '...' : ''}
                        </div>
                        <div class="order-total">${Math.round(order.total_amount)} ETB</div>
                        <div class="order-actions">
                            ${getOrderActions(order)}
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading order history:', error);
                document.getElementById('orderHistoryBody').innerHTML = `
                    <div style="text-align: center; padding: 20px; color: #ef4444;">
                        Failed to load order history. Please try again.
                    </div>
                `;
            }
        }

        function getStatusText(status) {
            const statusMap = {
                'pending': 'Pending',
                'confirmed': 'Confirmed',
                'preparing': 'Preparing',
                'out_for_delivery': 'Out for Delivery',
                'delivered': 'Delivered',
                'cancelled': 'Cancelled'
            };
            return statusMap[status] || status;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function getOrderActions(order) {
            const actions = [];
            
            if (order.status === 'pending' || order.status === 'confirmed') {
                actions.push(`<button class="order-action-btn btn-cancel" onclick="cancelOrder(${order.id})">Cancel</button>`);
            }
            
            if (order.status === 'out_for_delivery' || order.status === 'preparing') {
                actions.push(`<button class="order-action-btn btn-track" onclick="trackOrder(${order.id})">Track</button>`);
            }
            
            if (order.status === 'delivered') {
                actions.push(`<button class="order-action-btn btn-reorder" onclick="reorderItems(${order.id})">Reorder</button>`);
            }
            
            return actions.join('');
        }

        async function cancelOrder(orderId) {
            if (confirm('Are you sure you want to cancel this order?')) {
                try {
                    const response = await fetch(`/api/orders/${orderId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ status: 'cancelled' })
                    });
                    
                    if (response.ok) {
                        alert('Order cancelled successfully');
                        loadOrderHistory(); // Refresh the list
                    } else {
                        alert('Failed to cancel order');
                    }
                } catch (error) {
                    console.error('Error cancelling order:', error);
                    alert('Failed to cancel order');
                }
            }
        }

        async function trackOrder(orderId) {
            try {
                const response = await fetch(`/api/orders/${orderId}`);
                if (response.ok) {
                    const order = await response.json();
                    alert(`Order #${orderId} Status: ${getStatusText(order.status)}\nEstimated delivery: ${order.estimated_delivery_time || 'Not available'}`);
                } else {
                    alert('Failed to track order');
                }
            } catch (error) {
                console.error('Error tracking order:', error);
                alert('Failed to track order');
            }
        }

        async function reorderItems(orderId) {
            try {
                const response = await fetch(`/api/orders/${orderId}`);
                if (response.ok) {
                    const order = await response.json();
                    
                    // Clear current cart
                    selectedItems = {};
                    
                    // Add items from previous order to cart
                    order.items.forEach(item => {
                        selectedItems[item.id] = {
                            ...item,
                            quantity: item.quantity
                        };
                    });
                    
                    // Update UI
                    displayProducts();
                    updateCartInfo();
                    updateMainButton();
                    
                    // Close order history modal
                    closeOrderHistory();
                    
                    alert('Items added to cart successfully!');
                } else {
                    alert('Failed to reorder items');
                }
            } catch (error) {
                console.error('Error reordering items:', error);
                alert('Failed to reorder items');
            }
        }

        // Share location in checkout modal
        function shareLocationInCheckout() {
            const locationBtn = document.querySelector('.location-btn');
            const addressField = document.getElementById('customerAddress');
            
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by this browser');
                return;
            }
            
            locationBtn.textContent = '📍 Getting Location...';
            locationBtn.disabled = true;
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    // Update address field with coordinates
                    const locationText = `📍 Live Location: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                    const currentAddress = addressField.value.trim();
                    
                    if (currentAddress && !currentAddress.includes('📍 Live Location:')) {
                        addressField.value = `${currentAddress}\n${locationText}`;
                    } else if (currentAddress.includes('📍 Live Location:')) {
                        // Replace existing location
                        addressField.value = currentAddress.replace(/📍 Live Location: [0-9.-]+, [0-9.-]+/g, '') + '\n' + locationText;
                    } else {
                        addressField.value = locationText;
                    }
                    
                    // Store coordinates for order submission
                    window.currentOrderLocation = {
                        latitude: lat,
                        longitude: lng
                    };
                    
                    // Update button state
                    locationBtn.textContent = '✅ Location Shared';
                    locationBtn.classList.add('success');
                    locationBtn.disabled = false;
                    
                    // Send live location to Telegram if available
                    if (window.Telegram && window.Telegram.WebApp) {
                        window.Telegram.WebApp.sendData(JSON.stringify({
                            type: 'location',
                            latitude: lat,
                            longitude: lng
                        }));
                    }
                },
                function(error) {
                    console.error('Error getting location:', error);
                    locationBtn.textContent = '📍 Share Location';
                    locationBtn.disabled = false;
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            alert('Location access denied. Please enable location permissions.');
                            break;
                        case error.POSITION_UNAVAILABLE:
                            alert('Location information unavailable.');
                            break;
                        case error.TIMEOUT:
                            alert('Location request timed out.');
                            break;
                        default:
                            alert('An unknown error occurred while retrieving location.');
                            break;
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // Load categories
        async function loadCategories() {
            try {
                const response = await fetch('/api/categories');
                const categories = await response.json();
                displayCategories(categories);
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        // Display categories
        function displayCategories(categories) {
            const container = document.getElementById('categoriesContainer');
            if (!container) return;
            container.innerHTML = '';
            
            categories.forEach(category => {
                const categoryCard = document.createElement('div');
                categoryCard.className = `category-card category-${category.name.toLowerCase()}`;
                categoryCard.onclick = () => filterByCategory(category.name);
                
                // Use image if available, otherwise use icon
                const imageHtml = category.image_url ? 
                    `<img src="${category.image_url}" alt="${category.name}" class="category-image" style="width: 40px; height: 40px; border-radius: 8px; object-fit: cover; margin-bottom: 8px;" loading="lazy">` :
                    `<div class="category-icon">${category.icon}</div>`;
                
                categoryCard.innerHTML = `
                    ${imageHtml}
                    <div class="category-name">${category.name}</div>
                `;
                
                container.appendChild(categoryCard);
            });
        }

        // Filter by category
        function filterByCategory(categoryName) {
            currentCategory = categoryName;
            displayProducts();
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            updateTexts();
            loadCategories();
            loadMenuItems();
            loadUserProfile();
            
            // Force profile update after a short delay to ensure elements are loaded
            setTimeout(() => {
                loadUserProfile();
            }, 500);
        });
    </script>
</body>
