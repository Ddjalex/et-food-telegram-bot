<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Staff Dashboard - ET-FOOD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
            min-height: 100vh;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        
        .kitchen-navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .kitchen-navbar .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #3b82f6;
            text-decoration: none;
        }
        
        .kitchen-navbar .navbar-text {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .dashboard-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .dashboard-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .dashboard-header p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .stat-card .icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #3b82f6;
        }
        
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.5rem;
        }
        
        .stat-card .label {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .orders-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }
        
        .section-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }
        
        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f8fafc;
            margin: 0;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .refresh-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        .order-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .order-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .order-id {
            font-size: 1.1rem;
            font-weight: 600;
            color: #3b82f6;
        }
        
        .order-time {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        
        .order-customer {
            font-size: 1rem;
            color: #f8fafc;
            margin-bottom: 0.5rem;
        }
        
        .order-total {
            font-size: 1.1rem;
            font-weight: 600;
            color: #10b981;
            margin-bottom: 1rem;
        }
        
        .order-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .status-confirmed {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        .status-preparing {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        
        .status-ready {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .order-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .action-btn {
            flex: 1;
            padding: 0.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        
        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .loading-spinner {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #94a3b8;
        }
        
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #475569;
        }
        
        @media (max-width: 768px) {
            .dashboard-container {
                padding: 1rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .orders-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .dashboard-card p {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        
        .dashboard-card .btn {
            background: linear-gradient(45deg, #ff6b6b, #ffa726);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .dashboard-card .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }
        
        .quick-actions {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .quick-actions h3 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }
        
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        
        .action-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 20px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            color: white;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 10px;
        }
        
        .stat-card .label {
            font-size: 1rem;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .dashboard-cards {
                grid-template-columns: 1fr;
            }
            
            .dashboard-header h1 {
                font-size: 2rem;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .action-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="kitchen-navbar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <a href="/kitchen" class="navbar-brand">
                    <i class="fas fa-utensils me-2"></i>
                    Kitchen Dashboard
                </a>
                <div class="navbar-text">
                    <i class="fas fa-user-circle me-1"></i>
                    Kitchen Staff
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <h1>Professional Kitchen Management</h1>
            <p>Streamline your restaurant operations with real-time order management and analytics</p>
        </div>
        
        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="value" id="pendingOrders">0</div>
                <div class="label">Pending Orders</div>
            </div>
            
            <div class="stat-card">
                <div class="icon">
                    <i class="fas fa-fire"></i>
                </div>
                <div class="value" id="preparingOrders">0</div>
                <div class="label">Preparing</div>
            </div>
            
            <div class="stat-card">
                <div class="icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="value" id="readyOrders">0</div>
                <div class="label">Ready</div>
            </div>
            
            <div class="stat-card">
                <div class="icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="value" id="todayRevenue">0</div>
                <div class="label">Today Revenue</div>
            </div>
        </div>
        
        <!-- Orders Section -->
        <div class="orders-section">
            <div class="section-header">
                <h2>
                    <i class="fas fa-list-alt me-2"></i>
                    Active Orders
                </h2>
                <button class="refresh-btn" onclick="loadOrders()">
                    <i class="fas fa-sync-alt me-1"></i>
                    Refresh
                </button>
            </div>
            
            <div id="ordersContainer">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p>Loading orders...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load dashboard data on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadOrders();
            loadStatistics();
            
            // Auto-refresh every 30 seconds
            setInterval(loadOrders, 30000);
            setInterval(loadStatistics, 60000);
        });
        
        async function loadOrders() {
            try {
                const response = await fetch('/kitchen/orders');
                const orders = await response.json();
                
                displayOrders(orders);
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('ordersContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <h3>Error Loading Orders</h3>
                        <p>Unable to load orders. Please check your connection and try again.</p>
                    </div>
                `;
            }
        }
        
        function displayOrders(orders) {
            const container = document.getElementById('ordersContainer');
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">
                            <i class="fas fa-clipboard-check"></i>
                        </div>
                        <h3>No Active Orders</h3>
                        <p>All orders have been completed. Great job!</p>
                    </div>
                `;
                return;
            }
            
            const ordersGrid = document.createElement('div');
            ordersGrid.className = 'orders-grid';
            
            orders.forEach(order => {
                const orderCard = createOrderCard(order);
                ordersGrid.appendChild(orderCard);
            });
            
            container.innerHTML = '';
            container.appendChild(ordersGrid);
        }
        
        function createOrderCard(order) {
            const card = document.createElement('div');
            card.className = 'order-card';
            
            const statusClass = `status-${order.status}`;
            
            card.innerHTML = `
                <div class="order-header">
                    <div class="order-id">Order #${order.id}</div>
                    <div class="order-time">${order.minutes_ago} min ago</div>
                </div>
                
                <div class="order-customer">
                    <strong>${order.customer_name}</strong>
                    <br>
                    <small>${order.customer_phone}</small>
                </div>
                
                <div class="order-total">
                    Total: ${order.total_amount} ETB
                </div>
                
                <div class="order-status ${statusClass}">
                    ${order.status}
                </div>
                
                <div class="order-actions">
                    ${getOrderActions(order)}
                </div>
            `;
            
            return card;
        }
        
        function getOrderActions(order) {
            switch (order.status) {
                case 'pending':
                    return `
                        <button class="action-btn btn-primary" onclick="updateOrderStatus(${order.id}, 'confirmed')">
                            <i class="fas fa-check me-1"></i>
                            Confirm
                        </button>
                        <button class="action-btn btn-danger" onclick="showUnavailableModal(${order.id})">
                            <i class="fas fa-times me-1"></i>
                            Unavailable
                        </button>
                    `;
                case 'confirmed':
                    return `
                        <button class="action-btn btn-warning" onclick="updateOrderStatus(${order.id}, 'preparing')">
                            <i class="fas fa-fire me-1"></i>
                            Start Cooking
                        </button>
                    `;
                case 'preparing':
                    return `
                        <button class="action-btn btn-success" onclick="updateOrderStatus(${order.id}, 'ready')">
                            <i class="fas fa-bell me-1"></i>
                            Mark Ready
                        </button>
                    `;
                case 'ready':
                    return `
                        <button class="action-btn btn-primary" onclick="viewOrderDetails(${order.id})">
                            <i class="fas fa-eye me-1"></i>
                            View Details
                        </button>
                    `;
                default:
                    return '';
            }
        }
        
        async function updateOrderStatus(orderId, newStatus) {
            try {
                const response = await fetch(`/api/orders/${orderId}/status`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                if (response.ok) {
                    loadOrders();
                    loadStatistics();
                } else {
                    alert('Failed to update order status');
                }
            } catch (error) {
                console.error('Error updating order status:', error);
                alert('Error updating order status');
            }
        }
        
        function showUnavailableModal(orderId) {
            const reason = prompt('Please provide a reason why this order is unavailable:');
            if (reason) {
                markOrderUnavailable(orderId, reason);
            }
        }
        
        async function markOrderUnavailable(orderId, reason) {
            try {
                const response = await fetch(`/api/orders/${orderId}/unavailable`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ reason: reason })
                });
                
                if (response.ok) {
                    loadOrders();
                    loadStatistics();
                } else {
                    alert('Failed to mark order as unavailable');
                }
            } catch (error) {
                console.error('Error marking order unavailable:', error);
                alert('Error marking order unavailable');
            }
        }
        
        async function loadStatistics() {
            try {
                const response = await fetch('/kitchen/orders');
                const orders = await response.json();
                
                const stats = calculateStatistics(orders);
                updateStatisticsDisplay(stats);
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }
        
        function calculateStatistics(orders) {
            const stats = {
                pending: 0,
                preparing: 0,
                ready: 0,
                todayRevenue: 0
            };
            
            const today = new Date().toISOString().split('T')[0];
            
            orders.forEach(order => {
                switch (order.status) {
                    case 'pending':
                        stats.pending++;
                        break;
                    case 'preparing':
                        stats.preparing++;
                        break;
                    case 'ready':
                        stats.ready++;
                        break;
                }
                
                const orderDate = new Date(order.created_at).toISOString().split('T')[0];
                if (orderDate === today) {
                    stats.todayRevenue += order.total_amount;
                }
            });
            
            return stats;
        }
        
        function updateStatisticsDisplay(stats) {
            document.getElementById('pendingOrders').textContent = stats.pending;
            document.getElementById('preparingOrders').textContent = stats.preparing;
            document.getElementById('readyOrders').textContent = stats.ready;
            document.getElementById('todayRevenue').textContent = stats.todayRevenue.toFixed(0) + ' ETB';
        }
        
        function viewOrderDetails(orderId) {
            // This would open a modal with detailed order information
            alert(`Order details for Order #${orderId} - Feature coming soon!`);
        }
                // Load menu items count
                const menuResponse = await fetch('/api/kitchen/menu-items');
                const menuData = await menuResponse.json();
                if (menuData.success) {
                    document.getElementById('totalMenuItems').textContent = menuData.menu_items.length;
                }
                
                // Load categories count
                const categoriesResponse = await fetch('/api/kitchen/categories');
                const categoriesData = await categoriesResponse.json();
                if (categoriesData.success) {
                    document.getElementById('totalCategories').textContent = categoriesData.categories.length;
                }
                
                // Load orders count
                const ordersResponse = await fetch('/api/orders');
                const ordersData = await ordersResponse.json();
                if (ordersData.success) {
                    document.getElementById('totalOrders').textContent = ordersData.orders.length;
                    
                    // Count today's orders
                    const today = new Date().toISOString().split('T')[0];
                    const todayOrders = ordersData.orders.filter(order => 
                        order.created_at.startsWith(today)
                    );
                    document.getElementById('todayOrders').textContent = todayOrders.length;
                }
            } catch (error) {
                console.error('Error loading dashboard stats:', error);
            }
        }
    </script>
</body>
</html>
