<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Management - ET-FOOD Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .admin-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }
        .restaurant-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .restaurant-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
        }
        .btn-success {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
        }
        .btn-warning {
            background: linear-gradient(45deg, #ffc107, #fd7e14);
            border: none;
        }
        .btn-danger {
            background: linear-gradient(45deg, #dc3545, #e83e8c);
            border: none;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-active {
            background: #28a745;
            color: white;
        }
        .status-inactive {
            background: #dc3545;
            color: white;
        }
        .featured-badge {
            background: linear-gradient(45deg, #ff6b6b, #ffa726);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
        }
        .stats-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .stats-number {
            font-size: 2rem;
            font-weight: bold;
            color: #ffc107;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1><i class="fas fa-store"></i> Restaurant Management</h1>
                <button class="btn btn-primary" onclick="showAddRestaurantModal()">
                    <i class="fas fa-plus"></i> Add Restaurant
                </button>
            </div>

            <!-- Statistics Cards -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-number" id="totalRestaurants">0</div>
                        <div>Total Restaurants</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-number" id="activeRestaurants">0</div>
                        <div>Active Restaurants</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-number" id="featuredRestaurants">0</div>
                        <div>Featured Restaurants</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-number" id="totalOrders">0</div>
                        <div>Total Orders</div>
                    </div>
                </div>
            </div>

            <!-- Restaurants List -->
            <div id="restaurantsList">
                <div class="text-center">
                    <div class="spinner-border text-light" role="status">
                        <span class="visually-hidden">Loading restaurants...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Restaurant Modal -->
    <div class="modal fade" id="restaurantModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="restaurantModalTitle">Add Restaurant</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="restaurantForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Restaurant Name *</label>
                                    <input type="text" class="form-control" id="restaurantName" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Phone Number *</label>
                                    <input type="tel" class="form-control" id="restaurantPhone" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="restaurantDescription" rows="3"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Address *</label>
                            <textarea class="form-control" id="restaurantAddress" rows="2" required></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Latitude</label>
                                    <input type="number" class="form-control" id="restaurantLatitude" step="0.000001" placeholder="9.0579">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Longitude</label>
                                    <input type="number" class="form-control" id="restaurantLongitude" step="0.000001" placeholder="38.7914">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Logo URL</label>
                                    <input type="url" class="form-control" id="restaurantLogo">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Cover Image URL</label>
                                    <input type="url" class="form-control" id="restaurantCover">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">Delivery Fee (ETB)</label>
                                    <input type="number" class="form-control" id="restaurantDeliveryFee" min="0" step="0.01" placeholder="50">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">Minimum Order (ETB)</label>
                                    <input type="number" class="form-control" id="restaurantMinOrder" min="0" step="0.01" placeholder="200">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">Delivery Time</label>
                                    <input type="text" class="form-control" id="restaurantDeliveryTime" placeholder="30-45 minutes">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="restaurantActive">
                                        <label class="form-check-label" for="restaurantActive">
                                            Active Restaurant
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="restaurantFeatured">
                                        <label class="form-check-label" for="restaurantFeatured">
                                            Featured Restaurant
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <input type="hidden" id="restaurantId">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveRestaurant()">Save Restaurant</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let restaurants = [];
        let currentRestaurantId = null;

        // Load restaurants on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadRestaurants();
        });

        async function loadRestaurants() {
            try {
                const response = await fetch('/api/admin/restaurants');
                const data = await response.json();
                
                if (data.success) {
                    restaurants = data.restaurants;
                    displayRestaurants();
                    updateStatistics();
                } else {
                    showAlert('Error loading restaurants: ' + data.error, 'danger');
                }
            } catch (error) {
                console.error('Error loading restaurants:', error);
                showAlert('Error loading restaurants. Please try again.', 'danger');
            }
        }

        function displayRestaurants() {
            const restaurantsList = document.getElementById('restaurantsList');
            
            if (restaurants.length === 0) {
                restaurantsList.innerHTML = `
                    <div class="alert alert-info">
                        <h4>No restaurants found</h4>
                        <p>Click "Add Restaurant" to create your first restaurant.</p>
                    </div>
                `;
                return;
            }
            
            restaurantsList.innerHTML = '';
            
            restaurants.forEach(restaurant => {
                const restaurantCard = document.createElement('div');
                restaurantCard.className = 'restaurant-card';
                restaurantCard.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <div class="d-flex align-items-center mb-2">
                                <h5 class="mb-0 me-3">${restaurant.name}</h5>
                                <span class="status-badge ${restaurant.is_active ? 'status-active' : 'status-inactive'}">
                                    ${restaurant.is_active ? 'Active' : 'Inactive'}
                                </span>
                                ${restaurant.is_featured ? '<span class="featured-badge ms-2">Featured</span>' : ''}
                            </div>
                            <p class="mb-2">${restaurant.description || 'No description'}</p>
                            <div class="row">
                                <div class="col-md-6">
                                    <small><i class="fas fa-map-marker-alt"></i> ${restaurant.address}</small><br>
                                    <small><i class="fas fa-phone"></i> ${restaurant.phone}</small>
                                </div>
                                <div class="col-md-6">
                                    <small><i class="fas fa-motorcycle"></i> Delivery: ${restaurant.delivery_fee} ETB</small><br>
                                    <small><i class="fas fa-clock"></i> ${restaurant.estimated_delivery_time}</small>
                                </div>
                            </div>
                        </div>
                        <div class="text-end">
                            <button class="btn btn-sm btn-warning me-2" onclick="editRestaurant(${restaurant.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm ${restaurant.is_active ? 'btn-secondary' : 'btn-success'}" 
                                    onclick="toggleRestaurantStatus(${restaurant.id})">
                                <i class="fas fa-power-off"></i>
                            </button>
                        </div>
                    </div>
                `;
                restaurantsList.appendChild(restaurantCard);
            });
        }

        function updateStatistics() {
            const totalRestaurants = restaurants.length;
            const activeRestaurants = restaurants.filter(r => r.is_active).length;
            const featuredRestaurants = restaurants.filter(r => r.is_featured).length;
            
            document.getElementById('totalRestaurants').textContent = totalRestaurants;
            document.getElementById('activeRestaurants').textContent = activeRestaurants;
            document.getElementById('featuredRestaurants').textContent = featuredRestaurants;
        }

        function showAddRestaurantModal() {
            currentRestaurantId = null;
            document.getElementById('restaurantModalTitle').textContent = 'Add Restaurant';
            document.getElementById('restaurantForm').reset();
            document.getElementById('restaurantActive').checked = true;
            
            const modal = new bootstrap.Modal(document.getElementById('restaurantModal'));
            modal.show();
        }

        function editRestaurant(restaurantId) {
            const restaurant = restaurants.find(r => r.id === restaurantId);
            if (!restaurant) return;
            
            currentRestaurantId = restaurantId;
            document.getElementById('restaurantModalTitle').textContent = 'Edit Restaurant';
            
            // Populate form
            document.getElementById('restaurantName').value = restaurant.name;
            document.getElementById('restaurantPhone').value = restaurant.phone;
            document.getElementById('restaurantDescription').value = restaurant.description || '';
            document.getElementById('restaurantAddress').value = restaurant.address;
            document.getElementById('restaurantLatitude').value = restaurant.latitude || '';
            document.getElementById('restaurantLongitude').value = restaurant.longitude || '';
            document.getElementById('restaurantLogo').value = restaurant.logo_url || '';
            document.getElementById('restaurantCover').value = restaurant.cover_image_url || '';
            document.getElementById('restaurantDeliveryFee').value = restaurant.delivery_fee || '';
            document.getElementById('restaurantMinOrder').value = restaurant.minimum_order || '';
            document.getElementById('restaurantDeliveryTime').value = restaurant.estimated_delivery_time || '';
            document.getElementById('restaurantActive').checked = restaurant.is_active;
            document.getElementById('restaurantFeatured').checked = restaurant.is_featured;
            
            const modal = new bootstrap.Modal(document.getElementById('restaurantModal'));
            modal.show();
        }

        async function saveRestaurant() {
            const formData = {
                name: document.getElementById('restaurantName').value,
                phone: document.getElementById('restaurantPhone').value,
                description: document.getElementById('restaurantDescription').value,
                address: document.getElementById('restaurantAddress').value,
                latitude: parseFloat(document.getElementById('restaurantLatitude').value) || null,
                longitude: parseFloat(document.getElementById('restaurantLongitude').value) || null,
                logo_url: document.getElementById('restaurantLogo').value,
                cover_image_url: document.getElementById('restaurantCover').value,
                delivery_fee: parseFloat(document.getElementById('restaurantDeliveryFee').value) || 0,
                minimum_order: parseFloat(document.getElementById('restaurantMinOrder').value) || 0,
                estimated_delivery_time: document.getElementById('restaurantDeliveryTime').value || '30-45 minutes',
                is_active: document.getElementById('restaurantActive').checked,
                is_featured: document.getElementById('restaurantFeatured').checked
            };
            
            try {
                const url = currentRestaurantId 
                    ? `/api/admin/restaurants/${currentRestaurantId}`
                    : '/api/admin/restaurants';
                
                const method = currentRestaurantId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert(data.message, 'success');
                    bootstrap.Modal.getInstance(document.getElementById('restaurantModal')).hide();
                    loadRestaurants();
                } else {
                    showAlert('Error: ' + data.error, 'danger');
                }
            } catch (error) {
                console.error('Error saving restaurant:', error);
                showAlert('Error saving restaurant. Please try again.', 'danger');
            }
        }

        async function toggleRestaurantStatus(restaurantId) {
            try {
                const response = await fetch(`/api/admin/restaurants/${restaurantId}/toggle-status`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert(data.message, 'success');
                    loadRestaurants();
                } else {
                    showAlert('Error: ' + data.error, 'danger');
                }
            } catch (error) {
                console.error('Error toggling restaurant status:', error);
                showAlert('Error updating restaurant status. Please try again.', 'danger');
            }
        }

        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.querySelector('.admin-container').insertBefore(alert, document.querySelector('.admin-container').firstChild);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }
    </script>
</body>
</html>
