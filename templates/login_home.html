<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ET-FOOD - Login Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #4facfe 50%, #00f2fe 75%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-portal {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 3rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        .portal-header {
            margin-bottom: 3rem;
        }
        
        .portal-header h1 {
            color: #333;
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }
        
        .portal-header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .login-options {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .login-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            color: white;
        }
        
        .login-card:hover::before {
            opacity: 1;
        }
        
        .login-card-content {
            position: relative;
            z-index: 1;
        }
        
        .superadmin-card {
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .admin-card {
            --gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .kitchen-card {
            --gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .login-card i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }
        
        .superadmin-card i {
            color: #667eea;
        }
        
        .admin-card i {
            color: #4facfe;
        }
        
        .kitchen-card i {
            color: #f5576c;
        }
        
        .login-card h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .login-card p {
            font-size: 0.95rem;
            opacity: 0.8;
            margin: 0;
        }
        
        .footer-links {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .footer-links a {
            color: #666;
            text-decoration: none;
            margin: 0 1rem;
            font-size: 0.9rem;
        }
        
        .footer-links a:hover {
            color: #333;
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .login-portal {
                margin: 1rem;
                padding: 2rem;
            }
            
            .portal-header h1 {
                font-size: 2rem;
            }
            
            .login-card {
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-portal">
        <div class="portal-header">
            <h1>
                <i class="fas fa-utensils" style="color: #667eea; margin-right: 10px;"></i>
                ET-FOOD
            </h1>
            <p>Select your role to access the system</p>
        </div>
        
        <div class="login-options">
            <a href="/superadmin/login/dashboard" class="login-card superadmin-card">
                <div class="login-card-content">
                    <i class="fas fa-crown"></i>
                    <h3>Super Administrator</h3>
                    <p>System-wide administration and management</p>
                </div>
            </a>
            
            <a href="/admin/login/dashboard" class="login-card admin-card">
                <div class="login-card-content">
                    <i class="fas fa-user-tie"></i>
                    <h3>Restaurant Admin</h3>
                    <p>Restaurant operations and staff management</p>
                </div>
            </a>
            
            <a href="/kitchen/login/dashboard" class="login-card kitchen-card">
                <div class="login-card-content">
                    <i class="fas fa-utensils"></i>
                    <h3>Kitchen Staff</h3>
                    <p>Order management and kitchen operations</p>
                </div>
            </a>
        </div>
        
        <div class="footer-links">
            <a href="/">Customer App</a>
            <a href="/menu">View Menu</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
