<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ET-FOOD - Food Delivery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
        }
        
        /* Header with location */
        .header {
            background: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .location-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        
        .location-icon {
            color: #ef4444;
            font-size: 18px;
        }
        
        .location-text {
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }
        
        .notification-icon {
            background: #f3f4f6;
            border: none;
            border-radius: 8px;
            padding: 8px;
            color: #374151;
            cursor: pointer;
        }
        
        /* Restaurant header */
        .restaurant-header {
            background: white;
            position: relative;
            overflow: hidden;
        }
        
        .restaurant-cover {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            background-size: cover;
            background-position: center;
            position: relative;
        }
        
        .restaurant-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.3));
            height: 60px;
        }
        
        .restaurant-info-header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .restaurant-logo {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: #f3f4f6;
            border: 3px solid white;
            margin-top: -30px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #666;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .restaurant-details h1 {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            margin: 0 0 4px 0;
        }
        
        .restaurant-details p {
            font-size: 14px;
            color: #6b7280;
            margin: 0;
        }

        /* Search bar */
        .search-section {
            padding: 20px;
            background: white;
        }
        
        .search-bar {
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #e5e7eb;
            border-radius: 25px;
            background: #f9fafb;
            font-size: 16px;
            outline: none;
        }
        
        .search-input::placeholder {
            color: #9ca3af;
        }
        
        .search-input:focus {
            border-color: #ef4444;
            background: white;
        }
        
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
        }
        
        /* Banner slider */
        .banner-section {
            padding: 0 20px 20px;
        }
        
        .banner-slider {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .banner-slider::-webkit-scrollbar {
            display: none;
        }
        
        .banner-card {
            min-width: 300px;
            height: 120px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            color: white;
            scroll-snap-align: start;
            position: relative;
            overflow: hidden;
        }
        
        .banner-content h3 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .banner-content p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .banner-discount {
            font-size: 32px;
            font-weight: bold;
            text-align: right;
        }
        
        /* Categories */
        .categories-section {
            padding: 0 20px 20px;
        }
        
        .categories-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .categories-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
        }
        
        .categories-scroll {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        
        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 70px;
            cursor: pointer;
            scroll-snap-align: start;
            transition: transform 0.2s;
        }
        
        .category-item:hover {
            transform: scale(1.05);
        }
        
        .category-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff2e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid #ff6b35;
        }
        
        .category-name {
            font-size: 12px;
            font-weight: 500;
            color: #374151;
            text-align: center;
            line-height: 1.2;
        }
        
        /* Special offers */
        .offers-section {
            padding: 0 20px 20px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
        }
        
        .filter-btn {
            background: #fff;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .offer-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        
        .offer-card:hover {
            transform: translateY(-2px);
        }
        
        .offer-image {
            width: 100%;
            height: 100px;
            object-fit: cover;
            background: #f3f4f6;
        }
        
        .offer-content {
            padding: 12px;
        }
        
        .offer-title {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 5px;
        }
        
        .offer-price {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .current-price {
            font-size: 14px;
            font-weight: bold;
            color: #ef4444;
        }
        
        .original-price {
            font-size: 12px;
            color: #9ca3af;
            text-decoration: line-through;
        }
        
        .discount-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #10b981;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        
        /* Restaurants section */
        .restaurants-section {
            padding: 0 20px 80px;
        }
        
        .restaurant-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .restaurant-card:hover {
            transform: translateY(-2px);
        }
        
        .restaurant-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background: #f3f4f6;
        }
        
        .restaurant-info {
            padding: 15px;
        }
        
        .restaurant-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        
        .restaurant-name {
            font-size: 16px;
            font-weight: 600;
            color: #111827;
        }
        
        .restaurant-rating {
            display: flex;
            align-items: center;
            gap: 3px;
            background: #fef3c7;
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        .rating-star {
            color: #f59e0b;
            font-size: 12px;
        }
        
        .rating-value {
            font-size: 12px;
            font-weight: 500;
            color: #92400e;
        }
        
        .restaurant-details {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .distance-info, .time-info {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #6b7280;
        }
        
        .distance-badge, .time-badge {
            background: #fef2f2;
            color: #dc2626;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 500;
        }
        
        .avg-price {
            font-size: 12px;
            color: #6b7280;
        }
        
        /* Bottom navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex: 1;
            color: #6b7280;
            text-decoration: none;
            font-size: 10px;
        }
        
        .nav-item.active {
            color: #ef4444;
        }
        
        .nav-icon {
            font-size: 20px;
        }
        
        /* Loading states */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        
        .spinner {
            border: 2px solid #f3f4f6;
            border-top: 2px solid #ef4444;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Cart */
        .cart-float {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #dc2626;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 0;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }

        .close {
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: #666;
        }

        .close:hover {
            color: #000;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        /* Profile Styles */
        .profile-info {
            text-align: center;
            padding: 20px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin: 0 auto 15px;
        }

        .profile-info h3 {
            margin: 10px 0;
            color: #333;
        }

        .profile-info p {
            margin: 5px 0;
            color: #666;
        }

        /* Order Styles */
        .order-item {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: white;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-id {
            font-weight: bold;
            color: #333;
        }

        .order-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }

        .status-preparing {
            background: #cce5ff;
            color: #004085;
        }

        .status-ready {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-out_for_delivery {
            background: #ffeaa7;
            color: #8d6e00;
        }

        .status-delivered {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .order-details p {
            margin: 5px 0;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with Location -->
        <div class="header">
            <div class="location-info">
                <div class="location-icon">📍</div>
                <div class="location-text" id="userLocation">Loading location...</div>
            </div>
            <button class="notification-icon">🔔</button>
        </div>

        <!-- Restaurant Header -->
        <div class="restaurant-header" id="restaurantHeader" style="display: block;">
            <div class="restaurant-cover" id="restaurantCover">
                <div class="restaurant-overlay"></div>
            </div>
            <div class="restaurant-info-header">
                <div class="restaurant-logo" id="restaurantLogo">ET</div>
                <div class="restaurant-details">
                    <p id="restaurantDescription">Authentic Ethiopian Cuisine</p>
                </div>
            </div>
        </div>
        
        <!-- Search Bar -->
        <div class="search-section">
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Search your taste" id="searchInput">
                <div class="search-icon">🔍</div>
            </div>
        </div>
        
        <!-- Banner Slider -->
        <div class="banner-section">
            <div class="banner-slider">
                <div class="banner-card">
                    <div class="banner-content">
                        <h3>Special Pasta</h3>
                        <p>Delicious Italian cuisine</p>
                    </div>
                    <div class="banner-discount">25%<br>OFF</div>
                </div>
                <div class="banner-card" style="background: linear-gradient(135deg, #8b5cf6, #a855f7);">
                    <div class="banner-content">
                        <h3>Burger Combo</h3>
                        <p>Fresh and tasty</p>
                    </div>
                    <div class="banner-discount">20%<br>OFF</div>
                </div>
                <div class="banner-card" style="background: linear-gradient(135deg, #06b6d4, #0891b2);">
                    <div class="banner-content">
                        <h3>Ethiopian Special</h3>
                        <p>Traditional flavors</p>
                    </div>
                    <div class="banner-discount">15%<br>OFF</div>
                </div>
            </div>
        </div>
        
        <!-- Categories -->
        <div class="categories-section">
            <div class="categories-header">
                <h2>Categories</h2>
            </div>
            <div class="categories-scroll" id="categoriesContainer">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
        
        <!-- Special Offers -->
        <div class="offers-section">
            <div class="section-header">
                <h2 class="section-title">Special Offers</h2>
                <button class="filter-btn">Filter</button>
            </div>
            <div class="offers-grid" id="specialOffersContainer">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
        
        <!-- Nearby Restaurants -->
        <div class="restaurants-section">
            <div class="section-header">
                <h2 class="section-title">All Restaurants Nearby</h2>
                <button class="filter-btn">Filter</button>
            </div>
            <div id="restaurantsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
        
        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="#" class="nav-item active" onclick="showHome(); return false;">
                <div class="nav-icon">🏠</div>
                <div>Home</div>
            </a>
            <a href="#" class="nav-item" onclick="console.log('Orders clicked'); showOrders(); return false;">
                <div class="nav-icon">📋</div>
                <div>Orders</div>
            </a>
            <a href="#" class="nav-item" onclick="console.log('Profile clicked'); showProfile(); return false;">
                <div class="nav-icon">👤</div>
                <div>Profile</div>
            </a>
        </div>
        
        <!-- Floating Cart Button -->
        <button class="cart-float" id="cartButton">
            🛒
            <div class="cart-count" id="cartCount">0</div>
        </button>
    </div>

    <script>
        // Initialize Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Global variables
        let categories = [];
        let menuItems = [];
        let cart = [];
        let userLocationData = null;

        // Load user location from Telegram WebApp
        function loadUserLocation() {
            try {
                const tg = window.Telegram.WebApp;
                if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    // Try to get location from previous bot interaction
                    // This would typically come from the bot when user shares location
                    const savedLocation = localStorage.getItem('userLocation');
                    if (savedLocation) {
                        const location = JSON.parse(savedLocation);
                        document.getElementById('userLocation').textContent = location.address || 'Addis Ababa, Ethiopia';
                        userLocationData = location;
                    } else {
                        document.getElementById('userLocation').textContent = 'Addis Ababa, Ethiopia';
                    }
                } else {
                    document.getElementById('userLocation').textContent = 'Addis Ababa, Ethiopia';
                }
            } catch (error) {
                console.error('Error loading location:', error);
                document.getElementById('userLocation').textContent = 'Addis Ababa, Ethiopia';
            }
        }

        // Load categories from API
        async function loadCategories() {
            try {
                const response = await fetch('/api/menu');
                const data = await response.json();
                
                // Handle new API format with categories
                if (data.success && data.categories) {
                    categories = data.categories.map(cat => ({ name: cat.name }));
                } else if (Array.isArray(data)) {
                    // Fallback: extract unique categories from flat items array
                    const uniqueCategories = [...new Set(data.map(item => item.category))];
                    categories = uniqueCategories.map(name => ({ name }));
                } else {
                    categories = [];
                }
                renderCategories();
            } catch (error) {
                console.error('Error loading categories:', error);
                document.getElementById('categoriesContainer').innerHTML = '<p>Failed to load categories</p>';
            }
        }

        // Render categories
        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            
            const categoryIcons = {
                'Burgers': '🍔',
                'Breakfast': '🍳',
                'Fasting Specials': '🥗',
                'Books': '📚',
                'Pizza': '🍕',
                'Pasta': '🍝',
                'Sandwiches & Wraps': '🥪',
                'Shawarma': '🌯',
                'Rice Dishes': '🍚',
                'Traditional Ethiopian Breakfast': '☕',
                'Drinks': '🥤',
                'Fries & Pancakes': '🍟',
                'Snacks': '🍿',
                'Sauces': '🥄',
                'Borrito': '🌯',
                'Egg Dishes & Toast': '🍳',
                'Extras': '🍽️'
            };
            
            if (categories.length === 0) {
                container.innerHTML = '<p>No categories available</p>';
                return;
            }
            
            container.innerHTML = categories.map(category => `
                <div class="category-item" onclick="filterByCategory('${category.name}')">
                    <div class="category-icon">${categoryIcons[category.name] || '🍽️'}</div>
                    <div class="category-name">${category.name}</div>
                </div>
            `).join('');
        }

        // Load menu items for special offers
        async function loadSpecialOffers() {
            try {
                const response = await fetch('/api/menu');
                const data = await response.json();
                
                // Handle new API format
                if (data.success && data.items) {
                    menuItems = data.items;
                } else if (Array.isArray(data)) {
                    menuItems = data;
                } else {
                    menuItems = [];
                }
                
                renderSpecialOffers();
            } catch (error) {
                console.error('Error loading menu items:', error);
                document.getElementById('specialOffersContainer').innerHTML = '<p>Failed to load offers</p>';
            }
        }

        // Render special offers (first 6 items with discount)
        function renderSpecialOffers() {
            const container = document.getElementById('specialOffersContainer');
            const specialItems = menuItems.slice(0, 6);
            
            if (specialItems.length === 0) {
                container.innerHTML = '<p>No special offers available</p>';
                return;
            }
            
            container.innerHTML = specialItems.map(item => {
                const discount = Math.floor(Math.random() * 30) + 10; // Random discount 10-40%
                const originalPrice = item.price;
                const discountPrice = originalPrice * (1 - discount / 100);
                
                return `
                    <div class="offer-card" onclick="addToCart(${item.id})">
                        <div class="discount-badge">${discount}% OFF</div>
                        <img src="${item.image_url || '/static/placeholder-food.jpg'}" alt="${item.name}" class="offer-image" 
                             onerror="this.src='/static/placeholder-food.jpg'">
                        <div class="offer-content">
                            <div class="offer-title">${item.name}</div>
                            <div class="offer-price">
                                <span class="current-price">${discountPrice.toFixed(0)} Br</span>
                                <span class="original-price">${originalPrice.toFixed(0)} Br</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Add to cart
        function addToCart(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            if (item) {
                const existingItem = cart.find(c => c.id === itemId);
                if (existingItem) {
                    existingItem.quantity += 1;
                } else {
                    cart.push({ ...item, quantity: 1 });
                }
                updateCartUI();
            }
        }

        // Update cart UI
        function updateCartUI() {
            const cartButton = document.getElementById('cartButton');
            const cartCount = document.getElementById('cartCount');
            
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            if (totalItems > 0) {
                cartButton.style.display = 'flex';
                cartCount.textContent = totalItems;
            } else {
                cartButton.style.display = 'none';
            }
        }

        function openRestaurant(restaurantId) {
            // Store selected restaurant and navigate to menu
            localStorage.setItem('selectedRestaurant', restaurantId);

            showRestaurantMenu(restaurantId);
        }

        function setActiveNavItem(index) {
            // Remove active class from all nav items
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            // Add active class to selected item
            document.querySelectorAll('.nav-item')[index].classList.add('active');
        }

        function loadUserOrders() {
            try {
                // Create orders modal first
                showOrdersModal();
                
                const tg = window.Telegram.WebApp;
                let userId = null;
                
                // Try to get user ID from various sources
                if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    userId = tg.initDataUnsafe.user.id;
                } else if (tg && tg.initData) {
                    // Try to parse initData manually
                    try {
                        const urlParams = new URLSearchParams(tg.initData);
                        const userParam = urlParams.get('user');
                        if (userParam) {
                            const user = JSON.parse(decodeURIComponent(userParam));
                            userId = user.id;
                        }
                    } catch (e) {
                        console.log('Could not parse initData:', e);
                    }
                }
                
                console.log('User ID found:', userId);
                console.log('Telegram WebApp data:', tg);
                
                if (!userId) {
                    // Try to use URL parameters or default to known active user
                    const urlParams = new URLSearchParams(window.location.search);
                    userId = urlParams.get('user_id') || '383870190'; // DJ ALEX's ID from bot interaction
                    console.log('Using fallback user ID:', userId);
                }

                // Load orders from API
                fetch(`/api/user-orders/${userId}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('Orders data received:', data);
                        displayOrders(data.orders || []);
                    })
                    .catch(error => {
                        console.error('Error loading orders:', error);
                        document.getElementById('ordersContent').innerHTML = `
                            <div style="text-align: center; padding: 20px;">
                                <h3>Error Loading Orders</h3>
                                <p>Could not load your order history.</p>
                                <p style="color: #666; font-size: 14px;">Error: ${error.message}</p>
                                <button onclick="loadUserOrders()" style="margin-top: 10px; padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;">Try Again</button>
                            </div>
                        `;
                    });
            } catch (error) {
                console.error('Error in loadUserOrders:', error);
                showOrdersModal();
                document.getElementById('ordersContent').innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <h3>Technical Error</h3>
                        <p>Unable to load orders interface.</p>
                        <p style="color: #666; font-size: 14px;">Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        function showOrdersModal() {

        function showProfileModal(user) {
            // Create profile modal if it doesn't exist
            if (!document.getElementById('profileModal')) {
                const modal = document.createElement('div');
                modal.id = 'profileModal';
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="modal-content">

                document.body.appendChild(modal);

            // Display user profile
            document.getElementById('profileContent').innerHTML = `
                <div class="profile-info">
                    <div class="profile-avatar">${user.first_name?.[0] || 'U'}</div>
                    <h3>${user.first_name || ''} ${user.last_name || ''}</h3>
                    <p>@${user.username || 'N/A'}</p>
                    <p>User ID: ${user.id}</p>
                    ${user.language_code ? `<p>Language: ${user.language_code}</p>` : ''}
                </div>
            `;
            
            document.getElementById('profileModal').style.display = 'block';
        }

        function displayOrders(orders) {
            const container = document.getElementById('ordersContent');
            
            if (!orders || orders.length === 0) {
                container.innerHTML = '<p>No orders found</p>';
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="order-item">
                    <div class="order-header">
                        <span class="order-id">Order #${order.id}</span>
                        <span class="order-status status-${order.status}">${order.status}</span>
                    </div>
                    <div class="order-details">
                        <p><strong>Date:</strong> ${new Date(order.created_at).toLocaleDateString()}</p>
                        <p><strong>Items:</strong> ${JSON.parse(order.items || '[]').length} items</p>
                        <p><strong>Total:</strong> ${order.total_amount} Br</p>
                        <p><strong>Payment:</strong> ${order.payment_method}</p>
                    </div>
                </div>
            `).join('');
        }

        function hideModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.style.display = 'none';
            }
        }

        // Load restaurant information with logo and cover image
        async function loadRestaurantInfo(restaurantId = null) {
            try {
                // Get selected restaurant from localStorage or use default
                const selectedRestaurant = restaurantId || localStorage.getItem('selectedRestaurant') || 2;
                console.log('Loading restaurant info for ID:', selectedRestaurant);
                
                const response = await fetch(`/api/restaurants/info?restaurant_id=${selectedRestaurant}`);
                const data = await response.json();
                
                console.log('Restaurant data received:', data);
                
                if (data.success && data.restaurant) {
                    const restaurant = data.restaurant;
                    
                    // Update restaurant description in header only
                    document.getElementById('restaurantDescription').textContent = restaurant.description || 'Delicious Food';
                    
                    // Update restaurant logo
                    const logoElement = document.getElementById('restaurantLogo');
                    if (restaurant.logo_url) {
                        console.log('Setting logo URL:', restaurant.logo_url);
                        logoElement.style.backgroundImage = `url(${restaurant.logo_url})`;
                        logoElement.style.backgroundSize = 'cover';
                        logoElement.style.backgroundPosition = 'center';
                        logoElement.style.borderRadius = '50%';
                        logoElement.textContent = '';
                    } else {
                        logoElement.style.backgroundImage = '';
                        logoElement.textContent = restaurant.name ? restaurant.name.charAt(0) : 'R';
                    }
                    
                    // Update restaurant cover image
                    const coverElement = document.getElementById('restaurantCover');
                    if (restaurant.cover_image_url) {
                        console.log('Setting cover URL:', restaurant.cover_image_url);
                        coverElement.style.backgroundImage = `url(${restaurant.cover_image_url})`;
                        coverElement.style.backgroundSize = 'cover';
                        coverElement.style.backgroundPosition = 'center';
                    } else {
                        coverElement.style.backgroundImage = '';
                    }
                    
                    console.log('Restaurant info updated successfully');
                }
            } catch (error) {
                console.error('Error loading restaurant info:', error);
                // Keep default values if loading fails
            }
        }

        // Initialize app
        async function initApp() {
            console.log('Initializing app...');
            loadUserLocation();
            
            // Load restaurant info and images
            await loadRestaurantInfo();
            
            // Auto-select the first restaurant to skip restaurant selection
            const defaultRestaurantId = 2;
            localStorage.setItem('selectedRestaurant', defaultRestaurantId);
            
            await loadCategories();
            await loadSpecialOffers();
            await loadRestaurants();
            
            // Auto-focus on the selected restaurant
            showRestaurantMenu(defaultRestaurantId);
            
            console.log('App initialized. Functions available:', {
                showHome: typeof showHome,
                showOrders: typeof showOrders,
                showProfile: typeof showProfile
            });
        }

            console.log('showHome:', typeof showHome);
            console.log('showOrders:', typeof showOrders);

        }

        // Start the app
