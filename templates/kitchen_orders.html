<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Orders - ET-FOOD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin: 20px;
            min-height: calc(100vh - 40px);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }
        .order-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }
        .order-card:hover {
            transform: translateY(-5px);
        }
        .status-badge {
            font-size: 0.8em;
            padding: 5px 12px;
            border-radius: 20px;
        }
        .status-pending { background-color: #ffc107; color: #000; }
        .status-confirmed { background-color: #17a2b8; color: white; }
        .status-preparing { background-color: #fd7e14; color: white; }
        .status-ready { background-color: #28a745; color: white; }
        .order-items {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1><i class="fas fa-clipboard-list"></i> Kitchen Orders</h1>
            <p class="mb-0">Manage incoming orders and update their status</p>
        </div>

        <div class="p-4">
            <!-- Navigation -->
            <div class="row mb-4">
                <div class="col-12">
                    <nav class="nav nav-pills nav-fill">
                        <a class="nav-link" href="/kitchen/food-management">
                            <i class="fas fa-utensils"></i> Food Management
                        </a>
                        <a class="nav-link active" href="/kitchen/orders">
                            <i class="fas fa-clipboard-list"></i> Orders
                        </a>
                        <a class="nav-link" href="/kitchen/analytics">
                            <i class="fas fa-chart-bar"></i> Analytics
                        </a>
                        <a class="nav-link" href="/kitchen/settings">
                            <i class="fas fa-cog"></i> Settings
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Orders Container -->
            <div id="ordersContainer" class="row">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading orders...</span>
                    </div>
                    <p class="mt-3">Loading orders...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allOrders = [];

        // Load orders on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadOrders();
            // Refresh orders every 30 seconds
            setInterval(loadOrders, 30000);
        });

        // Load orders from API
        async function loadOrders() {
            try {
                const response = await fetch('/api/kitchen/orders');
                const data = await response.json();
                
                if (data.success) {
                    allOrders = data.orders || [];
                    displayOrders(allOrders);
                } else {
                    showError('Failed to load orders: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                showError('Error loading orders: ' + error.message);
            }
        }

        // Display orders
        function displayOrders(orders) {
            const container = document.getElementById('ordersContainer');
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                        <h3>No Active Orders</h3>
                        <p class="text-muted">All caught up! No pending orders at the moment.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            orders.forEach(order => {
                html += `
                    <div class="col-md-6 col-lg-4">
                        <div class="order-card card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="mb-0">Order #${order.id}</h6>
                                <span class="status-badge status-${order.status}">${order.status.toUpperCase()}</span>
                            </div>
                            <div class="card-body">
                                <div class="mb-2">
                                    <strong><i class="fas fa-user"></i> ${order.customer_name}</strong>
                                </div>
                                <div class="mb-2">
                                    <small class="text-muted"><i class="fas fa-phone"></i> ${order.phone}</small>
                                </div>
                                <div class="mb-2">
                                    <small class="text-muted"><i class="fas fa-map-marker-alt"></i> ${order.address || 'No address'}</small>
                                </div>
                                
                                <div class="order-items">
                                    <strong>Items:</strong>
                                    ${order.items.map(item => `
                                        <div class="d-flex justify-content-between">
                                            <span>${item.name} x${item.quantity}</span>
                                            <span>${item.price} ETB</span>
                                        </div>
                                    `).join('')}
                                </div>
                                
                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <strong>Total: ${order.total} ETB</strong>
                                    <small class="text-muted">${formatTime(order.created_at)}</small>
                                </div>
                                
                                ${order.special_instructions ? `
                                    <div class="mt-2">
                                        <small><strong>Instructions:</strong> ${order.special_instructions}</small>
                                    </div>
                                ` : ''}
                                
                                <div class="mt-3">
                                    <select class="form-select form-select-sm" onchange="updateOrderStatus(${order.id}, this.value)">
                                        <option value="">Update Status</option>
                                        <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                                        <option value="preparing" ${order.status === 'preparing' ? 'selected' : ''}>Preparing</option>
                                        <option value="ready" ${order.status === 'ready' ? 'selected' : ''}>Ready</option>
                                        <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // Update order status
        async function updateOrderStatus(orderId, newStatus) {
            if (!newStatus) return;
            
            try {
                const response = await fetch(`/api/kitchen/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess(`Order #${orderId} status updated to ${newStatus}`);
                    loadOrders(); // Reload orders
                } else {
                    showError(data.message || 'Failed to update order status');
                }
            } catch (error) {
                console.error('Error updating order status:', error);
                showError('Error updating order status');
            }
        }

        // Format time
        function formatTime(timestamp) {
            if (!timestamp) return 'Unknown';
            const date = new Date(timestamp);
            return date.toLocaleString();
        }

        // Show success message
        function showSuccess(message) {
            // Simple alert for now - can be enhanced with toast notifications
            alert('Success: ' + message);
        }

        // Show error message
        function showError(message) {
            // Simple alert for now - can be enhanced with toast notifications
            alert('Error: ' + message);
        }
    </script>
</body>
</html>
