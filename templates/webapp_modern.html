<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .search-bar {
            position: relative;
            margin-bottom: 30px;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            background: #16213e;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        
        .search-input::placeholder {
            color: #6b7280;
        }
        
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }
        
        .categories {
            margin-bottom: 30px;
        }
        
        .categories h2 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .category-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            color: #1a1a2e;
            font-weight: 600;
        }
        
        .category-card:hover {
            transform: scale(1.05);
        }
        
        .category-burgers {
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
        }
        
        .category-snacks {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
        }
        
        .category-sauces {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
        }
        
        .category-drinks {
            background: linear-gradient(135deg, #fce7f3, #fbcfe8);
        }
        
        .category-icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }
        
        .products {
            margin-bottom: 100px;
        }
        
        .products h2 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .product-card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        
        .product-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        
        .product-info {
            padding: 15px;
        }
        
        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #ffffff;
        }
        
        .product-price {
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 10px;
        }
        
        .product-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn-remove {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            width: 35px;
            height: 35px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-add {
            background: #f97316;
            color: white;
            border: none;
            border-radius: 8px;
            flex: 1;
            height: 35px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .cart-info {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #3b82f6;
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            z-index: 1000;
        }
        
        .quantity-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #f97316;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .category-grid,
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .category-card {
                padding: 15px;
            }
            
            .category-icon {
                font-size: 24px;
            }
        }
    </style>
</head>

        // Show order form
        function showOrderForm() {
            // Create order data
            const orderItems = [];
            let totalAmount = 0;
            
            Object.keys(selectedItems).forEach(itemId => {
                const item = menuItems.find(i => i.id == itemId);
                const quantity = selectedItems[itemId];
                if (item && quantity > 0) {
                    const itemTotal = item.price * quantity;
                    orderItems.push({
                        id: item.id,
                        name: item.name,
                        price: item.price,
                        quantity: quantity,
                        total: itemTotal
                    });
                    totalAmount += itemTotal;
                }
            });

            // Get user data from Telegram
            let userData = {};
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe.user) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                userData = {
                    telegram_user_id: user.id,
                    customer_name: `${user.first_name} ${user.last_name || ''}`.trim(),
                    customer_phone: user.phone_number || '',
                };
            }

            // Simple order submission
            submitOrder({
                ...userData,
                customer_address: 'Delivery address (to be collected)',
                items: orderItems,
                total_amount: totalAmount,
                payment_method: 'cash'
            });
        }
