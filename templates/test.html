<!DOCTYPE html>
<html>
<head>
    <title>Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>ET-FOOD App Test</h1>
    
    <div class="test-section">
        <h2>Server Status</h2>
        <p class="success">✓ Server is running on port 5000</p>
    </div>
    
    <div class="test-section">
        <h2>API Tests</h2>
        <button onclick="testCategories()">Test Categories API</button>
        <button onclick="testMenu()">Test Menu API</button>
        <div id="apiResults"></div>
    </div>
    
    <div class="test-section">
        <h2>Quick Links</h2>
        <p><a href="/webapp">Main WebApp</a></p>
        <p><a href="/admin">Admin Panel</a></p>
    </div>
    
    <script>
        async function testCategories() {
            try {
                const response = await fetch('/api/categories');
                const data = await response.json();
                document.getElementById('apiResults').innerHTML = 
                    `<div class="success">✓ Categories API working - ${data.length} categories found</div>`;
            } catch (error) {
                document.getElementById('apiResults').innerHTML = 
                    `<div class="error">✗ Categories API failed: ${error.message}</div>`;
            }
        }
        
        async function testMenu() {
            try {
                const response = await fetch('/api/menu');
                const data = await response.json();
                document.getElementById('apiResults').innerHTML = 
                    `<div class="success">✓ Menu API working - ${data.length} items found</div>`;
            } catch (error) {
                document.getElementById('apiResults').innerHTML = 
                    `<div class="error">✗ Menu API failed: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
