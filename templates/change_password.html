<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - ET-FOOD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .password-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
        }
        .password-strength {
            height: 5px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 5px;
        }
        .strength-bar {
            height: 100%;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        .weak { background: #ef4444; width: 25%; }
        .fair { background: #f59e0b; width: 50%; }
        .good { background: #10b981; width: 75%; }
        .strong { background: #059669; width: 100%; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card password-card">
                    <div class="card-header text-center py-4">
                        <h3 class="mb-0">
                            <i class="fas fa-key text-primary me-2"></i>
                            Change Password
                        </h3>
                    </div>
                    <div class="card-body p-4">
                        {% if error %}
                            <div class="alert alert-danger" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                {{ error }}
                            </div>
                        {% endif %}
                        
                        {% if success %}
                            <div class="alert alert-success" role="alert">
                                <i class="fas fa-check-circle me-2"></i>
                                {{ success }}
                            </div>
                        {% endif %}
                        
                        <form method="POST">
                            <div class="mb-3">
                                <label for="current_password" class="form-label">
                                    <i class="fas fa-lock me-1"></i>
                                    Current Password
                                </label>
                                <input type="password" class="form-control" id="current_password" 
                                       name="current_password" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="new_password" class="form-label">
                                    <i class="fas fa-key me-1"></i>
                                    New Password
                                </label>
                                <input type="password" class="form-control" id="new_password" 
                                       name="new_password" required minlength="8">
                                <div class="password-strength">
                                    <div class="strength-bar" id="strengthBar"></div>
                                </div>
                                <small class="text-muted" id="strengthText">Password strength</small>
                            </div>
                            
                            <div class="mb-4">
                                <label for="confirm_password" class="form-label">
                                    <i class="fas fa-check-double me-1"></i>
                                    Confirm New Password
                                </label>
                                <input type="password" class="form-control" id="confirm_password" 
                                       name="confirm_password" required minlength="8">
                                <small class="text-muted" id="matchText"></small>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-save me-2"></i>
                                    Change Password
                                </button>
                                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>
                                    Back to Dashboard
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <div class="card password-card p-3">
                        <h6 class="text-muted mb-2">
                            <i class="fas fa-info-circle me-1"></i>
                            Password Requirements
                        </h6>
                        <ul class="list-unstyled text-start mb-0 small">
                            <li><i class="fas fa-check text-success me-1"></i> At least 8 characters long</li>
                            <li><i class="fas fa-check text-success me-1"></i> Mix of uppercase and lowercase letters</li>
                            <li><i class="fas fa-check text-success me-1"></i> Include numbers and special characters</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password strength checker
        const newPassword = document.getElementById('new_password');
        const confirmPassword = document.getElementById('confirm_password');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        const matchText = document.getElementById('matchText');

        newPassword.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)) strength++;
            
            strengthBar.className = 'strength-bar';
            if (strength === 1) {
                strengthBar.classList.add('weak');
                strengthText.textContent = 'Weak password';
                strengthText.className = 'text-danger';
            } else if (strength === 2) {
                strengthBar.classList.add('fair');
                strengthText.textContent = 'Fair password';
                strengthText.className = 'text-warning';
            } else if (strength === 3) {
                strengthBar.classList.add('good');
                strengthText.textContent = 'Good password';
                strengthText.className = 'text-info';
            } else if (strength === 4) {
                strengthBar.classList.add('strong');
                strengthText.textContent = 'Strong password';
                strengthText.className = 'text-success';
            } else {
                strengthText.textContent = 'Password strength';
                strengthText.className = 'text-muted';
            }
        });

        confirmPassword.addEventListener('input', function() {
            if (this.value && newPassword.value) {
                if (this.value === newPassword.value) {
                    matchText.textContent = '✓ Passwords match';
                    matchText.className = 'text-success';
                } else {
                    matchText.textContent = '✗ Passwords do not match';
                    matchText.className = 'text-danger';
                }
            } else {
                matchText.textContent = '';
            }
        });
    </script>
</body>
</html>
