<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Menu Management - ET-FOOD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }
        
        .page-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .controls-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .controls-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .restaurant-select {
            flex: 1;
            min-width: 200px;
        }
        
        .search-box {
            flex: 2;
            min-width: 300px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .menu-item-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .menu-item-card:hover {
            transform: translateY(-5px);
        }

        .category-section {
            margin-bottom: 40px;
        }

        .category-header {
            background: linear-gradient(45deg, #ff6b6b, #ffa726);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-actions {
            display: flex;
            gap: 10px;
        }
        
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 15px;
            padding: 12px 15px;
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ff6b6b;
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 107, 0.25);
            color: white;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #ffa726);
            border: none;
            border-radius: 15px;
            padding: 12px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }
        
        .btn-success {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
            border-radius: 15px;
            padding: 12px 20px;
            font-weight: 600;
        }
        
        .btn-warning {
            background: linear-gradient(45deg, #ffc107, #fd7e14);
            border: none;
            border-radius: 15px;
            padding: 8px 15px;
            font-weight: 600;
        }
        
        .btn-danger {
            background: linear-gradient(45deg, #dc3545, #e83e8c);
            border: none;
            border-radius: 15px;
            padding: 8px 15px;
            font-weight: 600;
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        
        .menu-item-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .menu-item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        
        .menu-item-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
        }
        
        .menu-item-content {
            padding: 20px;
        }
        
        .menu-item-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .menu-item-description {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 15px;
        }
        
        .menu-item-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .menu-item-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffd700;
        }
        
        .menu-item-category {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        
        .menu-item-actions {
            display: flex;
            gap: 10px;
        }
        
        .availability-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .available {
            background: #28a745;
            color: white;
        }
        
        .unavailable {
            background: #dc3545;
            color: white;
        }
        
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ff6b6b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border-radius: 20px;
            border: none;
        }
        
        .modal-header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 20px 20px 0 0;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }
        
        .modal-body {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .modal .form-control, .modal .form-select {
            background: white;
            border: 2px solid #e9ecef;
            color: #333;
        }
        
        .modal .form-control:focus, .modal .form-select:focus {
            background: white;
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .image-upload-section {
            border: 2px dashed #ccc;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .image-upload-section:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 15px;
        }
        
        @media (max-width: 768px) {
            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }
            
            .restaurant-select, .search-box {
                width: 100%;
            }
            
            .action-buttons {
                justify-content: center;
            }
            
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>🍽️ Kitchen Menu Management</h1>
            <p>Add, edit, and manage menu items with prices and images</p>
        </div>
        
        <div class="controls-section">
            <div class="controls-row">
                <div class="restaurant-select">
                    <label for="restaurantSelect" class="form-label">🏪 Restaurant</label>
                    <select class="form-select" id="restaurantSelect" onchange="loadMenuItems()">
                        <option value="">Loading restaurants...</option>
                    </select>
                </div>
                
                <div class="search-box">
                    <label for="searchInput" class="form-label">🔍 Search Menu Items</label>
                    <input type="text" class="form-control" id="searchInput" placeholder="Search by name, category, or price..." onkeyup="searchMenuItems()">
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="showAddItemModal()">
                        <i class="fas fa-plus"></i> Add Item
                    </button>
                    <button class="btn btn-success" onclick="showAddCategoryModal()">
                        <i class="fas fa-folder-plus"></i> Add Category
                    </button>
                </div>
            </div>
        </div>
        
        <div id="menuItemsContainer">
            <div class="loading-spinner">
                <div class="spinner"></div>
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Menu Item Modal -->
    <div class="modal fade" id="menuItemModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="menuItemModalTitle">Add Menu Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="menuItemForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="itemName">Item Name *</label>
                                    <input type="text" class="form-control" id="itemName" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="itemPrice">Price (ETB) *</label>
                                    <input type="number" class="form-control" id="itemPrice" step="0.01" min="0" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="itemDescription">Description</label>
                            <textarea class="form-control" id="itemDescription" rows="3" placeholder="Describe your delicious item..."></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="itemCategory">Category *</label>
                            <select class="form-select" id="itemCategory" required>
                                <option value="">Select category...</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Item Image</label>
                            <div class="image-upload-section" onclick="document.getElementById('imageInput').click()">
                                <i class="fas fa-cloud-upload-alt fa-2x" style="color: #ccc; margin-bottom: 10px;"></i>
                                <p>Click to upload image or drag and drop</p>
                                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(this)">
                                <img id="imagePreview" class="image-preview" style="display: none;">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="itemImageUrl">Or Image URL</label>
                            <input type="url" class="form-control" id="itemImageUrl" placeholder="https://example.com/image.jpg">
                        </div>
                        
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="itemAvailable" checked>
                            <label class="form-check-label" for="itemAvailable">
                                Available for ordering
                            </label>
                        </div>
                        
                        <input type="hidden" id="editingItemId">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveMenuItem()">Save Item</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Category Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoryModalTitle">Add Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <div class="form-group">
                            <label for="categoryName">Category Name *</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="categoryDescription">Description</label>
                            <textarea class="form-control" id="categoryDescription" rows="2"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="categoryIcon">Icon (Emoji)</label>
                            <input type="text" class="form-control" id="categoryIcon" placeholder="🍔">
                        </div>
                        
                        <div class="form-group">
                            <label for="categorySortOrder">Sort Order</label>
                            <input type="number" class="form-control" id="categorySortOrder" min="0" value="0">
                        </div>
                        
                        <input type="hidden" id="editingCategoryId">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveCategory()">Save Category</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allMenuItems = [];
        let allCategories = [];
        let allRestaurants = [];
        let filteredItems = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            loadRestaurants();
            loadCategories();
        });
        
        async function loadRestaurants() {
            try {
                const response = await fetch('/api/kitchen/restaurants');
                const data = await response.json();
                
                if (data.success) {
                    allRestaurants = data.restaurants;
                    const select = document.getElementById('restaurantSelect');
                    select.innerHTML = '<option value="">Select restaurant...</option>';
                    
                    data.restaurants.forEach(restaurant => {
                        const option = document.createElement('option');
                        option.value = restaurant.id;
                        option.textContent = restaurant.name;
                        select.appendChild(option);
                    });
                    
                    // Auto-select first restaurant
                    if (data.restaurants.length > 0) {
                        select.value = data.restaurants[0].id;
                        loadMenuItems();
                    }
                }
            } catch (error) {
                console.error('Error loading restaurants:', error);
            }
        }
        
        async function loadCategories() {
            try {
                const response = await fetch('/api/kitchen/categories');
                const data = await response.json();
                
                if (data.success) {
                    allCategories = data.categories;
                    populateCategorySelect();
                }
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }
        
        function populateCategorySelect() {
            const select = document.getElementById('itemCategory');
            select.innerHTML = '<option value="">Select category...</option>';
            
            allCategories.forEach(category => {
                const option = document.createElement('option');
                option.value = category.id;
                option.textContent = `${category.icon} ${category.name}`;
                select.appendChild(option);
            });
        }
        
        async function loadMenuItems() {
            const restaurantId = document.getElementById('restaurantSelect').value;
            if (!restaurantId) return;
            
            try {
                const response = await fetch(`/api/kitchen/menu-items?restaurant_id=${restaurantId}`);
                const data = await response.json();
                
                if (data.success) {
                    allMenuItems = data.menu_items;
                    filteredItems = allMenuItems;
                    displayMenuItems();
                }
            } catch (error) {
                console.error('Error loading menu items:', error);
            }
        }
        
        function displayMenuItems() {
            const container = document.getElementById('menuItemsContainer');
            container.innerHTML = '';
            
            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.7);">
                        <h4>No menu items found</h4>
                        <p>Add your first menu item to get started</p>
                    </div>
                `;
                return;
            }
            
            const grid = document.createElement('div');
            grid.className = 'menu-grid';
            
            filteredItems.forEach(item => {
                const card = createMenuItemCard(item);
                grid.appendChild(card);
            });
            
            container.appendChild(grid);
        }
        
        function createMenuItemCard(item) {
            const card = document.createElement('div');
            card.className = 'menu-item-card';
            
            const category = allCategories.find(c => c.id === item.category_id);
            const categoryName = category ? `${category.icon} ${category.name}` : 'No Category';
            
            const imageUrl = item.image_url || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMjAwIiB2aWV3Qm94PSIwIDAgMzAwIDIwMCI+PHJlY3Qgd2lkdGg9IjMwMCIgaGVpZ2h0PSIyMDAiIGZpbGw9IiM2NjdlZWEiLz48dGV4dCB4PSIxNTAiIHk9IjEwMCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iIGZpbGw9IiNmZmZmZmYiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjIwIj7wn42lPC90ZXh0Pjwvc3ZnPg==';
            
            card.innerHTML = `
                <div style="position: relative;">
                    <img src="${imageUrl}" alt="${item.name}" class="menu-item-image">
                    <div class="availability-badge ${item.available ? 'available' : 'unavailable'}">
                        ${item.available ? 'Available' : 'Unavailable'}
                    </div>
                </div>
                <div class="menu-item-content">
                    <h3 class="menu-item-title">${item.name}</h3>
                    <p class="menu-item-description">${item.description || 'No description'}</p>
                    <div class="menu-item-details">
                        <span class="menu-item-price">${Math.round(item.price)} ETB</span>
                        <span class="menu-item-category">${categoryName}</span>
                    </div>
                    <div class="menu-item-actions">
                        <button class="btn btn-warning btn-sm" onclick="editMenuItem(${item.id})">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deleteMenuItem(${item.id})">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </div>
            `;
            
            return card;
        }
        
        function searchMenuItems() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (searchTerm) {
                filteredItems = allMenuItems.filter(item => 
                    item.name.toLowerCase().includes(searchTerm) ||
                    item.description.toLowerCase().includes(searchTerm) ||
                    item.price.toString().includes(searchTerm)
                );
            } else {
                filteredItems = allMenuItems;
            }
            
            displayMenuItems();
        }
        
        function showAddItemModal() {
            document.getElementById('menuItemModalTitle').textContent = 'Add Menu Item';
            document.getElementById('menuItemForm').reset();
            document.getElementById('editingItemId').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('itemAvailable').checked = true;
            
            const modal = new bootstrap.Modal(document.getElementById('menuItemModal'));
            modal.show();
        }
        
        function editMenuItem(itemId) {
            const item = allMenuItems.find(i => i.id === itemId);
            if (!item) return;
            
            document.getElementById('menuItemModalTitle').textContent = 'Edit Menu Item';
            document.getElementById('editingItemId').value = itemId;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemDescription').value = item.description || '';
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemCategory').value = item.category_id;
            document.getElementById('itemImageUrl').value = item.image_url || '';
            document.getElementById('itemAvailable').checked = item.available;
            
            if (item.image_url) {
                document.getElementById('imagePreview').src = item.image_url;
                document.getElementById('imagePreview').style.display = 'block';
            }
            
            const modal = new bootstrap.Modal(document.getElementById('menuItemModal'));
            modal.show();
        }
        
        async function saveMenuItem() {
            const form = document.getElementById('menuItemForm');
            const formData = new FormData();
            
            const itemData = {
                name: document.getElementById('itemName').value,
                description: document.getElementById('itemDescription').value,
                price: parseFloat(document.getElementById('itemPrice').value),
                category_id: parseInt(document.getElementById('itemCategory').value),
                restaurant_id: parseInt(document.getElementById('restaurantSelect').value),
                image_url: document.getElementById('itemImageUrl').value,
                available: document.getElementById('itemAvailable').checked
            };
            
            // Handle image upload
            const imageInput = document.getElementById('imageInput');
            if (imageInput.files[0]) {
                const uploadFormData = new FormData();
                uploadFormData.append('image', imageInput.files[0]);
                
                try {
                    const uploadResponse = await fetch('/api/kitchen/upload-image', {
                        method: 'POST',
                        body: uploadFormData
                    });
                    
                    const uploadData = await uploadResponse.json();
                    if (uploadData.success) {
                        itemData.image_url = uploadData.image_url;
                    }
                } catch (error) {
                    console.error('Error uploading image:', error);
                }
            }
            
            try {
                const itemId = document.getElementById('editingItemId').value;
                const url = itemId ? `/api/kitchen/menu-items/${itemId}` : '/api/kitchen/menu-items';
                const method = itemId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(itemData)
                });
                
                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                    bootstrap.Modal.getInstance(document.getElementById('menuItemModal')).hide();
                    loadMenuItems();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error saving menu item:', error);
                alert('Error saving menu item');
            }
        }
        
        async function deleteMenuItem(itemId) {
            if (!confirm('Are you sure you want to delete this menu item?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/kitchen/menu-items/${itemId}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                    loadMenuItems();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error deleting menu item:', error);
                alert('Error deleting menu item');
            }
        }
        
        function showAddCategoryModal() {
            document.getElementById('categoryModalTitle').textContent = 'Add Category';
            document.getElementById('categoryForm').reset();
            document.getElementById('editingCategoryId').value = '';
            
            const modal = new bootstrap.Modal(document.getElementById('categoryModal'));
            modal.show();
        }
        
        async function saveCategory() {
            const categoryData = {
                name: document.getElementById('categoryName').value,
                description: document.getElementById('categoryDescription').value,
                icon: document.getElementById('categoryIcon').value || '🍽️',
                sort_order: parseInt(document.getElementById('categorySortOrder').value) || 0
            };
            
            try {
                const categoryId = document.getElementById('editingCategoryId').value;
                const url = categoryId ? `/api/kitchen/categories/${categoryId}` : '/api/kitchen/categories';
                const method = categoryId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(categoryData)
                });
                
                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                    bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
                    loadCategories();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error saving category:', error);
                alert('Error saving category');
            }
        }
        
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
