<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Restaurant - ET-FOOD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .restaurant-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }
        .restaurant-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }
        .restaurant-info h5 {
            margin-bottom: 10px;
            color: #fff;
        }
        .restaurant-info p {
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.8);
        }
        .featured-badge {
            background: linear-gradient(45deg, #ff6b6b, #ffa726);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .delivery-info {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
        }
        .delivery-info small {
            color: rgba(255, 255, 255, 0.7);
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .page-header p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
        }
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-open {
            background: #28a745;
            color: white;
        }
        .status-closed {
            background: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="page-header">
            <h1>🍽️ Choose Your Restaurant</h1>
            <p>Select from our partner restaurants to start ordering</p>
        </div>
        
        <div id="restaurantsList" class="row">
            <!-- Loading spinner -->
            <div class="loading-spinner">
                <div class="spinner-border text-light" role="status">
                    <span class="visually-hidden">Loading restaurants...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load restaurants on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadRestaurants();
        });

        async function loadRestaurants() {
            try {
                const response = await fetch('/api/restaurants');
                const data = await response.json();
                
                const restaurantsList = document.getElementById('restaurantsList');
                
                if (data.success && data.restaurants.length > 0) {
                    restaurantsList.innerHTML = '';
                    
                    data.restaurants.forEach(restaurant => {
                        const restaurantCard = createRestaurantCard(restaurant);
                        restaurantsList.appendChild(restaurantCard);
                    });
                } else {
                    restaurantsList.innerHTML = `
                        <div class="col-12">
                            <div class="alert alert-warning text-center">
                                <h4>No restaurants available</h4>
                                <p>Please check back later or contact support.</p>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading restaurants:', error);
                document.getElementById('restaurantsList').innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger text-center">
                            <h4>Error loading restaurants</h4>
                            <p>Please try again later.</p>
                        </div>
                    </div>
                `;
            }
        }

        function createRestaurantCard(restaurant) {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4';
            
            const currentTime = new Date();
            const currentHour = currentTime.getHours();
            const currentDay = currentTime.toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
            
            // Check if restaurant is open
            let isOpen = false;
            let openingHours = '';
            
            if (restaurant.opening_hours && restaurant.opening_hours[currentDay]) {
                openingHours = restaurant.opening_hours[currentDay];
                const [openTime, closeTime] = openingHours.split('-');
                const [openHour] = openTime.split(':').map(Number);
                const [closeHour] = closeTime.split(':').map(Number);
                
                isOpen = currentHour >= openHour && currentHour < closeHour;
            }
            
            col.innerHTML = `
                <div class="restaurant-card p-3" onclick="selectRestaurant(${restaurant.id})">
                    <div class="d-flex align-items-center mb-3">
                        <img src="${restaurant.logo_url || '/static/images/restaurant-placeholder.png'}" 
                             alt="${restaurant.name}" class="restaurant-logo me-3">
                        <div class="restaurant-info flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5>${restaurant.name}</h5>
                                ${restaurant.is_featured ? '<span class="featured-badge">Featured</span>' : ''}
                            </div>
                            <p class="mb-1">${restaurant.description || 'Delicious food awaits!'}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="status-badge ${isOpen ? 'status-open' : 'status-closed'}">
                                    ${isOpen ? 'Open' : 'Closed'}
                                </span>
                                <small>${openingHours || 'Hours not specified'}</small>
                            </div>
                        </div>
                    </div>
                    
                    <div class="delivery-info">
                        <div class="row">
                            <div class="col-6">
                                <small><strong>Delivery Fee:</strong> ${restaurant.delivery_fee} ETB</small>
                            </div>
                            <div class="col-6">
                                <small><strong>Min Order:</strong> ${restaurant.minimum_order} ETB</small>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-6">
                                <small><strong>Delivery Time:</strong> ${restaurant.estimated_delivery_time}</small>
                            </div>
                            <div class="col-6">
                                <small><strong>📍</strong> ${restaurant.address || 'Addis Ababa'}</small>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            return col;
        }

        function selectRestaurant(restaurantId) {
            // Store selected restaurant in localStorage
            localStorage.setItem('selectedRestaurant', restaurantId);
            
            // Redirect to main menu page with restaurant parameter
            window.location.href = `/?restaurant=${restaurantId}`;
        }
    </script>
</body>
</html>
