<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Restaurant - ET-FOOD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #9ca3af;
            font-size: 16px;
        }
        
        .restaurant-grid {
            display: grid;
            gap: 20px;
        }
        
        .restaurant-card {
            background: linear-gradient(135deg, #16213e 0%, #1e293b 100%);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .restaurant-card:hover {
            transform: translateY(-5px);
            border-color: #f97316;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.3);
        }
        
        .restaurant-image {
            width: 100%;
            height: 150px;
            background: #374151;
            border-radius: 8px;
            margin-bottom: 15px;
            background-size: cover;
            background-position: center;
        }
        
        .restaurant-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }
        
        .restaurant-description {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .restaurant-address {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 10px;
        }
        
        .restaurant-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        
        .delivery-fee {
            color: #10b981;
            font-weight: bold;
        }
        
        .delivery-time {
            color: #f59e0b;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ Choose Your Restaurant</h1>
            <p>Select a restaurant to start ordering</p>
        </div>
        
        <div id="restaurantGrid" class="restaurant-grid">
            <div class="loading">Loading restaurants...</div>
        </div>
    </div>

    <script>
        async function loadRestaurants() {
            try {
                const response = await fetch('/api/restaurants');
                const restaurants = await response.json();
                
                const grid = document.getElementById('restaurantGrid');
                
                if (restaurants.length === 0) {
                    grid.innerHTML = '<div class="error">No restaurants available</div>';
                    return;
                }
                
                grid.innerHTML = restaurants.map(restaurant => `
                    <div class="restaurant-card" onclick="selectRestaurant(${restaurant.id})">
                        <div class="restaurant-image" style="background-image: url('${restaurant.logo_url || '/static/uploads/placeholder.jpg'}')"></div>
                        <div class="restaurant-name">${restaurant.name}</div>
                        <div class="restaurant-description">${restaurant.description || 'Fresh food delivered fast'}</div>
                        <div class="restaurant-address">📍 ${restaurant.address || 'Addis Ababa'}</div>
                        <div class="restaurant-meta">
                            <div class="delivery-fee">Delivery: ${restaurant.delivery_fee || '15'} ETB</div>
                            <div class="delivery-time">⏱️ ${restaurant.estimated_delivery_time || '30-45'} min</div>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading restaurants:', error);
                document.getElementById('restaurantGrid').innerHTML = 
                    '<div class="error">Failed to load restaurants</div>';
            }
        }
        
        function selectRestaurant(restaurantId) {
            // Store selection in localStorage
            localStorage.setItem('selectedRestaurant', restaurantId);
            
            // Redirect to restaurant menu
            window.location.href = `/restaurant/${restaurantId}`;
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadRestaurants);
    </script>
</body>
</html>
