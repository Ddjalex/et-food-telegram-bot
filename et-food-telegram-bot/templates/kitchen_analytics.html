<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Analytics - ET-FOOD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin: 20px;
            min-height: calc(100vh - 40px);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }
        .stat-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1><i class="fas fa-chart-bar"></i> Kitchen Analytics</h1>
            <p class="mb-0">Track performance and order statistics</p>
        </div>

        <div class="p-4">
            <!-- Navigation -->
            <div class="row mb-4">
                <div class="col-12">
                    <nav class="nav nav-pills nav-fill">
                        <a class="nav-link" href="/kitchen/food-management">
                            <i class="fas fa-utensils"></i> Food Management
                        </a>
                        <a class="nav-link" href="/kitchen/orders">
                            <i class="fas fa-clipboard-list"></i> Orders
                        </a>
                        <a class="nav-link active" href="/kitchen/analytics">
                            <i class="fas fa-chart-bar"></i> Analytics
                        </a>
                        <a class="nav-link" href="/kitchen/settings">
                            <i class="fas fa-cog"></i> Settings
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Statistics Cards -->
            <div class="row mb-4" id="statsContainer">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading analytics...</span>
                    </div>
                    <p class="mt-3">Loading analytics...</p>
                </div>
            </div>

            <!-- Charts -->
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="chart-container">
                        <h5>Order Status Distribution</h5>
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="chart-container">
                        <h5>Popular Items</h5>
                        <canvas id="popularItemsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let analytics = {};
        let statusChart = null;
        let popularItemsChart = null;

        // Load analytics on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadAnalytics();
        });

        // Load analytics from API
        async function loadAnalytics() {
            try {
                const response = await fetch('/api/kitchen/analytics');
                const data = await response.json();
                
                if (data.success) {
                    analytics = data.analytics;
                    displayStats();
                    createCharts();
                } else {
                    showError('Failed to load analytics: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
                showError('Error loading analytics: ' + error.message);
            }
        }

        // Display statistics cards
        function displayStats() {
            const container = document.getElementById('statsContainer');
            
            container.innerHTML = `
                <div class="col-md-3 mb-3">
                    <div class="stat-card card text-center p-3">
                        <i class="fas fa-calendar-day stat-icon text-primary"></i>
                        <h3 class="mb-0">${analytics.today_orders || 0}</h3>
                        <p class="text-muted mb-0">Today's Orders</p>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card card text-center p-3">
                        <i class="fas fa-calendar-week stat-icon text-success"></i>
                        <h3 class="mb-0">${analytics.week_orders || 0}</h3>
                        <p class="text-muted mb-0">This Week</p>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card card text-center p-3">
                        <i class="fas fa-clock stat-icon text-warning"></i>
                        <h3 class="mb-0">${analytics.status_counts?.pending || 0}</h3>
                        <p class="text-muted mb-0">Pending Orders</p>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card card text-center p-3">
                        <i class="fas fa-check-circle stat-icon text-info"></i>
                        <h3 class="mb-0">${analytics.status_counts?.delivered || 0}</h3>
                        <p class="text-muted mb-0">Delivered</p>
                    </div>
                </div>
            `;
        }

        // Create charts
        function createCharts() {
            createStatusChart();
            createPopularItemsChart();
        }

        // Create status distribution chart
        function createStatusChart() {
            const ctx = document.getElementById('statusChart').getContext('2d');
            
            if (statusChart) {
                statusChart.destroy();
            }
            
            const statusData = analytics.status_counts || {};
            const labels = Object.keys(statusData);
            const data = Object.values(statusData);
            const colors = [
                '#ffc107', '#17a2b8', '#fd7e14', '#28a745', '#6c757d', '#dc3545'
            ];
            
            statusChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.map(label => label.charAt(0).toUpperCase() + label.slice(1)),
                    datasets: [{
                        data: data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // Create popular items chart
        function createPopularItemsChart() {
            const ctx = document.getElementById('popularItemsChart').getContext('2d');
            
            if (popularItemsChart) {
                popularItemsChart.destroy();
            }
            
            const popularItems = analytics.popular_items || [];
            const labels = popularItems.map(item => item.name);
            const data = popularItems.map(item => item.count);
            
            popularItemsChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Orders',
                        data: data,
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        // Show error message
        function showError(message) {
            const container = document.getElementById('statsContainer');
            container.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-triangle"></i> ${message}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
