services:
  - type: web
    name: et-food-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --worker-connections 1000 --timeout 120 main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DATABASE_URL
        fromDatabase:
          name: et-food-postgres
          property: connectionString
    
databases:
  - name: et-food-postgres
    databaseName: et_food_db
    user: et_food_user